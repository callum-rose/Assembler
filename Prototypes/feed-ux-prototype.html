<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — play-the-news feed UX</title>
<!--
  ============================================================================
  THROWAWAY PROTOTYPE — not production code. Rewrite properly for uGUI.
  ============================================================================

  QUESTION IT ANSWERED
    What should the play-the-news feed look like?
    (SHIPPLAN decision #6: "catalogue of ALL generated games with played/
    unplayed state; news-like styling". Phase 3, days 15-19.)

  THE ANSWER (settled 2026-07-31)
    A newspaper front page: masthead, one full-width lead for today's game,
    then a 2-column grid of the archive grouped by recency, with a quiet
    inline filter riding the first section header.

    Arrived at over three rounds. Six variants were built and compared; see
    the branch history for the losing five, which are the primary source:
      ffa21591  A Front page / B Daily edition / C The wire / D Arcade grid
      41e40689  E Front page + grid  (A's layout + D's grid + the filter)
      000d414a  F Tighter lead       (E, shorter hero, badged, filter demoted)
    This file is F with the inline filter treatment, collapsed to one version.

  WHY THIS AND NOT THE OTHERS
    - A read as a news app, which is the target identity; B was cleaner but
      did not read as news and hid the catalogue behind a button; C and D
      treated the catalogue, not today, as the point.
    - The grid came from D: a full-width lead then two columns.
    - B contributed restraint only — spacing, the pill button, hairline rules.
    - The filter is INLINE rather than an icon+popover: on a ~14-item
      catalogue the one control that changes what you are looking at is
      cheaper to show than to hide. Revisit if the archive reaches a few
      hundred games or needs more than three filters — a popover is the only
      one of the two that scales, and it has room for per-filter counts.

  DESIGN CALLS WORTH RE-ARGUING IN UNITY
    1. The filter scopes the ARCHIVE ONLY. Today's lead never filters away,
       even once played — it just switches to a ghost "Play again". The
       alternative (filter also re-picks the lead, "NEXT UP" kicker) reads as
       a task list rather than a newspaper.
    2. Played cards keep their screenshot in COLOUR at 42% opacity. Greyscale
       on a light ground reads as a broken image, not a played game.
    3. Two columns fit a one-sentence blurb only, so this truncates at the
       first full stop. The generate skill should be writing a short first
       sentence deliberately rather than the feed cutting prose mid-thought.

  BLOCKER FOR THE REAL IMPLEMENTATION
    Assembler.Remote.GameManifestEntry is (Id, Title, Description,
    DescriptorUrl, Version). This design needs three more fields the manifest
    does not carry: publishedAt, thumbnail, channel (live|staging). That is a
    store-side schema change and should land before the uGUI work.

  LEGAL POSTURE BAKED IN (SHIPPLAN #11)
    No outlet article body, no outlet photos. The headline is OUR rewrite of
    the story hook, the blurb is copy about OUR game, the thumbnail is a
    screenshot from the validation sandbox.

  No persistence — played state is in memory and resets on reload.
  The yellow bar is prototype scaffolding, not part of the design.
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #14161a; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 28px 16px 140px; overflow-y: auto;
  }

  /* ---- phone frame: density judgements are worthless at desktop width ---- */
  .phone {
    width: 390px; height: 844px; flex: none;
    border-radius: 44px; border: 10px solid #000; background: #fff;
    box-shadow: 0 30px 70px rgba(0,0,0,.6);
    overflow: hidden; position: relative;
  }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
  .screen::-webkit-scrollbar { width: 0; }
  .shot > svg { display: block; width: 100%; height: 100%; }

  /* ======================================================================
     THE DESIGN
     ====================================================================== */
  .feed { background: #fff; color: #14161a; }

  .masthead {
    position: sticky; top: 0; z-index: 12; background: #fff;
    border-bottom: 2px solid #14161a; padding: 15px 20px 11px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .masthead h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 24px; letter-spacing: -.02em; font-weight: 700; }
  .masthead h1 span { color: #c8102e; }
  .masthead time { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: #8a919c; }

  /* --- lead: today's game --- */
  .hero { padding: 18px 20px 22px; }
  .hero .shot { position: relative; width: 100%; height: 172px; border-radius: 4px; overflow: hidden; margin-bottom: 14px; background: #eee; }
  .hero .badge {
    position: absolute; top: 10px; left: 10px;
    background: #c8102e; color: #fff; font-size: 9.5px; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase; padding: 5px 9px; border-radius: 2px;
  }
  .hero h2 { margin: 0 0 9px; font-family: Georgia, serif; font-size: 26px; line-height: 1.14; letter-spacing: -.022em; font-weight: 700; }
  .hero p { margin: 0 0 17px; font-size: 14.5px; line-height: 1.5; color: #56606d; }
  .playbtn {
    width: 100%; border: 0; cursor: pointer; font: inherit;
    background: #14161a; color: #fff; border-radius: 999px; padding: 15px;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  }
  .playbtn.done { background: #fff; color: #14161a; box-shadow: inset 0 0 0 1.5px #d6dae0; }
  .herometa { margin-top: 11px; text-align: center; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #a4abb5; }

  /* --- section header, carrying the filter on the first one --- */
  .sechead {
    position: sticky; top: 55px; z-index: 11; background: #fff;
    margin: 0 20px 12px; padding: 14px 0 7px; border-bottom: 1.5px solid #14161a;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .sechead > h4 { margin: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  .sechead.plain { justify-content: flex-start; margin-top: 26px; }

  .filter { display: flex; align-items: center; gap: 2px; flex: none; }
  .filter button {
    font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: none; border: 0; cursor: pointer; color: #b0b7c1; padding: 3px 5px; border-radius: 3px;
    white-space: nowrap;
  }
  .filter button.on { color: #14161a; background: #f0f2f5; }
  .filter i { color: #dde1e6; font-style: normal; font-size: 9px; }

  /* --- archive grid --- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 13px; padding: 0 20px; }
  /* Flex column + margin-top:auto on the meta keeps the "NEW / PLAYED · date"
     lines aligned across a row even when headlines wrap to different depths. */
  .card { cursor: pointer; display: flex; flex-direction: column; }
  .card .shot { width: 100%; aspect-ratio: 16 / 10; border-radius: 3px; overflow: hidden; background: #eee; margin-bottom: 9px; }
  .card h3 { margin: 0 0 5px; font-family: Georgia, serif; font-size: 15px; line-height: 1.22; font-weight: 700; }
  .card p { margin: 0 0 7px; font-size: 12px; line-height: 1.4; color: #7b8492; }
  .card .meta { margin-top: auto; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #a4abb5; display: flex; align-items: center; gap: 6px; }
  .card.played .shot { opacity: .42; }
  .card.played h3 { color: #9aa2ad; font-weight: 400; }
  .card.played p { color: #b3bac3; }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: #c8102e; flex: none; }
  .tick { color: #16a34a; font-weight: 800; font-size: 11px; }
  .stg { color: #b45309; font-weight: 700; }

  .empty { padding: 48px 20px; text-align: center; }
  .empty b { display: block; font-family: Georgia, serif; font-size: 19px; margin-bottom: 6px; }
  .empty span { font-size: 13px; color: #8a919c; }

  /* ======================================================================
     PROTOTYPE SCAFFOLDING — deliberately ugly, obviously not the design
     ====================================================================== */
  .devbar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 2px;
    background: #f2c94c; color: #1b1b1b; border-radius: 999px; padding: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; font-weight: 700; z-index: 100;
  }
  .devbar .tag { display: flex; align-items: center; padding: 0 12px; letter-spacing: .1em; }
  .devbar .state { display: flex; align-items: center; padding: 0 12px; border-left: 2px solid rgba(0,0,0,.2); font-weight: 500; opacity: .85; }
  .devbar button {
    font: inherit; border: 0; cursor: pointer; border-radius: 999px; padding: 8px 13px;
    background: transparent; color: #1b1b1b; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .devbar button.on, .devbar button.solid { background: #1b1b1b; color: #f2c94c; box-shadow: none; }

  /* ---- fake launch: download -> play -> gameover -> back to the feed ---- */
  .launch {
    position: absolute; inset: 0; z-index: 50; background: #06070a; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 32px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .launch h4 { margin: 0; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; font-weight: 600; }
  .launch p { margin: 0; font-size: 13px; opacity: .5; }
  .bar { width: 190px; height: 3px; background: #24262e; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #4ea1ff; transition: width .55s ease; }
  .fakegame { position: absolute; inset: 0; background: #0d1018; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .fakegame .stage { width: 220px; height: 220px; border: 1px solid #232838; border-radius: 12px; position: relative; overflow: hidden; }
  .fakegame .stage b { position: absolute; width: 26px; height: 26px; border-radius: 6px; background: #4ea1ff; left: 24px; top: 96px; animation: bob 1.1s ease-in-out infinite alternate; }
  .fakegame .stage s { position: absolute; width: 14px; height: 60px; background: #f2c94c; right: 26px; top: 70px; border-radius: 4px; }
  @keyframes bob { to { transform: translate(150px, 20px); } }
  .fakegame button { font: inherit; border: 0; cursor: pointer; background: #fff; color: #000; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 14px; }

  .notes { max-width: 430px; font-size: 12.5px; line-height: 1.6; color: #8b93a1; }
  .notes h5 { margin: 0 0 6px; color: #dfe4ec; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .notes ul { margin: 0; padding-left: 18px; }
  .notes li { margin-bottom: 5px; }
  .notes b { color: #dfe4ec; }
  .notes code { font-size: 11.5px; }
</style>
</head>
<body>

<div class="phone"><div class="screen" id="screen"></div></div>
<div class="notes" id="notes"></div>
<div class="devbar" id="devbar"></div>

<script>
// ===========================================================================
// MOCK DATA
// Mirrors GameManifestEntry + the three fields the manifest does not carry yet
// (publishedAt, thumbnail, channel). Headlines are OUR rewrites of the story
// hook, never the outlet's own text.
// ===========================================================================
const TODAY = '2026-07-31';

const GAMES = [
  { id:'capsule-catch',  title:'Mars Sample Capsule Comes Home',        blurb:'Thread the returning capsule through re-entry and stick the splashdown ring.', date:'2026-07-31', time:'07:02', played:false, channel:'live' },
  { id:'grid-balance',   title:'Heatwave Pushes The Grid To A Record',  blurb:'Juggle supply against demand. Brown out and it is over.',                     date:'2026-07-30', time:'06:58', played:false, channel:'live' },
  { id:'rate-runner',    title:'Central Bank Holds Rates A Fifth Time', blurb:'Nudge the dial, keep inflation inside the band for twelve quarters.',        date:'2026-07-29', time:'07:11', played:true,  channel:'live' },
  { id:'spot-kick',      title:'Euro Final Decided On Penalties',       blurb:'Five kicks. Read the keeper, time the strike.',                              date:'2026-07-28', time:'06:49', played:true,  channel:'live' },
  { id:'swarm-sweep',    title:'Bee Swarm Halts A City Centre Tram',    blurb:'Guide the swarm off the line before the next tram arrives.',                 date:'2026-07-27', time:'07:04', played:false, channel:'live' },
  { id:'packet-patch',   title:'Sea Cable Fault Slows Half A Continent',blurb:'Reroute packets around the break. Latency is the score.',                    date:'2026-07-26', time:'06:55', played:true,  channel:'live' },
  { id:'thin-air',       title:'A Marathon At Four Thousand Metres',    blurb:'Pace the climb. Spend oxygen too fast and you stall.',                       date:'2026-07-25', time:'07:20', played:false, channel:'live' },
  { id:'dig-site',       title:'Shipwreck Found Under A Car Park',      blurb:'Excavate the grid without cracking the hull.',                               date:'2026-07-24', time:'06:47', played:true,  channel:'live' },
  { id:'boarding-group', title:'Airline Rewrites Its Boarding Order',   blurb:'Seat the plane in the fewest moves. Aisle rage is the fail state.',          date:'2026-07-23', time:'07:08', played:false, channel:'live' },
  { id:'firebreak',      title:'Crews Contain The Ridge Fire',          blurb:'Cut breaks ahead of the wind. Hold the ridge for sixty seconds.',            date:'2026-07-22', time:'06:52', played:true,  channel:'live' },
  { id:'sun-chase',      title:'Solar Beats Coal For The First Time',   blurb:'Chase the light across the map, bank charge before dusk.',                   date:'2026-07-21', time:'07:15', played:false, channel:'live' },
  { id:'detour',         title:'Old Town Closes To Cars',              blurb:'Reroute the traffic. Every wrong turn adds a queue.',                        date:'2026-07-20', time:'06:44', played:true,  channel:'live' },
  { id:'blitz-clock',    title:'Teen Challenger Topples The Champion',  blurb:'Blitz chess against a shrinking clock. Trade time for tempo.',               date:'2026-07-19', time:'07:01', played:true,  channel:'live' },
  { id:'comet-trail',    title:'A Comet Visible Without A Telescope',   blurb:'Trace the tail before it drifts out of the frame.',                          date:'2026-07-18', time:'06:59', played:true,  channel:'live' },
  // Staging = published by the daemon, not yet promoted. Dev-mode only (SHIPPLAN #7).
  { id:'tide-line',      title:'Record Tide Reshapes The Estuary',      blurb:'Bank the sandbars before the next surge. UNPROMOTED.',                       date:'2026-07-31', time:'09:40', played:false, channel:'staging' },
];

// ===========================================================================
// STATE — in memory only, no persistence (that is what the prototype checks)
// ===========================================================================
const state = {
  played: new Set(GAMES.filter(g => g.played).map(g => g.id)),
  devMode: false,           // show the unpromoted staging channel
  filter: 'all',            // 'all' | 'unplayed' | 'played' — scopes the ARCHIVE only
};

const NOTES = `
  <h5>Decision · 31 Jul 2026</h5>
  <ul>
    <li>Newspaper front page: masthead, full-width lead for today, 2-column archive grid, <b>inline</b> filter on the first section header. Chosen over five other variants — see the branch history.</li>
    <li><b>Blocker:</b> <code>GameManifestEntry</code> needs <code>publishedAt</code>, <code>thumbnail</code> and <code>channel</code> before this can be built for real.</li>
    <li>The filter scopes the <b>archive only</b> — today's lead never filters away, it just becomes a ghost "Play again".</li>
    <li>Two columns fit a <b>one-sentence</b> blurb, so the generate skill should write a short first sentence deliberately.</li>
    <li>Revisit the inline filter if the archive reaches a few hundred games — an icon + popover is the version that scales, and it has room for per-filter counts.</li>
    <li>Toggle <b>DEV</b> to see how an unpromoted staging game surfaces.</li>
  </ul>
`;

// ===========================================================================
// THUMBNAILS — stand-ins for the sandbox auto-screenshot (SHIPPLAN #9).
// Deterministic per id, primitive shapes to match primitive-asset games.
// ===========================================================================
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function thumb(id) {
  const h = hash(id);
  // Small LCG so successive shapes decorrelate — a plain hash of (id + i) clusters them.
  let seed = h || 1;
  const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
  const hue = h % 360, hue2 = (hue + 40 + h % 60) % 360;
  const shapes = [];
  for (let i = 0; i < 11; i++) {
    const x = 2 + rnd() * 96, y = 2 + rnd() * 96, s = 5 + rnd() * 17, r = rnd();
    shapes.push((r < 0.34)
      ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s / 2).toFixed(1)}" fill="hsl(${hue2} 85% ${(56 + rnd() * 20).toFixed(0)}%)" opacity=".9"/>`
      : `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${s.toFixed(1)}" height="${(s * (0.5 + rnd())).toFixed(1)}" rx="2" fill="hsl(${hue2} 80% ${(48 + rnd() * 28).toFixed(0)}%)" opacity=".88"/>`);
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(${hue} 45% 22%)"/><stop offset="1" stop-color="hsl(${hue2} 55% 12%)"/>
    </linearGradient></defs>
    <rect width="100" height="100" fill="url(#g${h})"/>${shapes.join('')}</svg>`;
}

// ===========================================================================
// HELPERS
// ===========================================================================
const isPlayed = g => state.played.has(g.id);
const visible = () => GAMES.filter(g => state.devMode || g.channel === 'live');
const sorted = () => [...visible()].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
// The lead is always the newest *promoted* game — a staging entry must never
// take the "Today's game" slot just because the daemon published it later.
const leadGame = () => sorted().find(g => g.channel === 'live');
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const daysAgo = date => Math.round((new Date(TODAY) - new Date(date)) / 864e5);
const longDate = date => new Date(date + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fullDate = date => new Date(date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
function relDay(date) {
  const d = daysAgo(date);
  return d === 0 ? 'Today' : d === 1 ? 'Yesterday' : d < 7 ? `${d} days ago` : longDate(date);
}

// ===========================================================================
// FAKE LAUNCH — download -> play -> gameover -> back to the feed, now played.
// The point is to feel where you land on return, not to be a real game.
// ===========================================================================
function launch(id) {
  const game = GAMES.find(g => g.id === id);
  const overlay = document.createElement('div');
  overlay.className = 'launch';
  overlay.innerHTML = `
    <h4>Fetching descriptor</h4>
    <div class="bar"><i></i></div>
    <p>${esc(game.id)}/descriptor.yaml · v3 · 41 KB</p>`;
  document.querySelector('.phone').appendChild(overlay);
  requestAnimationFrame(() => overlay.querySelector('.bar i').style.width = '100%');

  setTimeout(() => {
    overlay.innerHTML = `
      <div class="fakegame">
        <div class="stage"><b></b><s></s></div>
        <button id="endgame">End run &amp; return</button>
      </div>`;
    overlay.querySelector('#endgame').onclick = () => {
      state.played.add(id);
      overlay.remove();
      render();
    };
  }, 750);
}

// ===========================================================================
// THE FEED
// ===========================================================================
function Feed() {
  const lead = leadGame();
  const pool = sorted().filter(g => g !== lead);   // the filter scopes this, never the lead
  const rest = state.filter === 'all' ? pool
    : state.filter === 'unplayed' ? pool.filter(g => !isPlayed(g))
    : pool.filter(g => isPlayed(g));

  const week = rest.filter(g => daysAgo(g.date) <= 6);
  const older = rest.filter(g => !week.includes(g));

  const card = g => `
    <div class="card ${isPlayed(g) ? 'played' : ''}" data-play="${g.id}">
      <div class="shot">${thumb(g.id)}</div>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.blurb.split('.')[0])}</p>
      <div class="meta">
        ${isPlayed(g) ? '<span class="tick">✓</span> Played' : '<span class="dot"></span> New'}
        <span>·</span><span>${relDay(g.date)}</span>
        ${g.channel === 'staging' ? '<span class="stg">· Staging</span>' : ''}
      </div>
    </div>`;

  const b = (k, l) => `<button class="${state.filter === k ? 'on' : ''}" data-filter="${k}">${l}</button>`;
  const filter = `<div class="filter">${b('all', 'All')}<i>·</i>${b('unplayed', 'Unplayed')}<i>·</i>${b('played', 'Played')}</div>`;

  // The filter always rides the FIRST section header on screen, whichever it is.
  const sections = [];
  if (week.length) sections.push(['Earlier this week', week]);
  if (older.length) sections.push(['The archive', older]);

  const body = sections.length
    ? sections.map(([title, items], i) => `
        <div class="sechead ${i ? 'plain' : ''}"><h4>${title}</h4>${i ? '' : filter}</div>
        <div class="grid">${items.map(card).join('')}</div>`).join('')
    : `<div class="sechead"><h4>The archive</h4>${filter}</div>
       <div class="empty">
         <b>${state.filter === 'unplayed' ? 'You’re all caught up.' : 'Nothing here.'}</b>
         <span>${state.filter === 'unplayed' ? 'Every game in the archive has been played.' : 'Try another filter.'}</span>
       </div>`;

  return `<div class="feed">
    <div class="masthead">
      <h1>The Daily <span>Build</span></h1>
      <time>${fullDate(TODAY)}</time>
    </div>

    <div class="hero">
      <div class="shot">${thumb(lead.id)}<span class="badge">Today's game</span></div>
      <h2>${esc(lead.title)}</h2>
      <p>${esc(lead.blurb)}</p>
      <button class="playbtn ${isPlayed(lead) ? 'done' : ''}" data-play="${lead.id}">
        ${isPlayed(lead) ? 'Play again' : 'Play now'}
      </button>
      ${isPlayed(lead) ? '<div class="herometa">✓ Played today</div>' : ''}
    </div>

    ${body}
    <div style="height:36px"></div>
  </div>`;
}

// ===========================================================================
// RENDER
// ===========================================================================
function render() {
  document.getElementById('screen').innerHTML = Feed();
  document.getElementById('notes').innerHTML = NOTES;
  document.getElementById('devbar').innerHTML = `
    <div class="tag">PROTOTYPE</div>
    <div class="state">${state.played.size}/${visible().length} played</div>
    <button class="${state.devMode ? 'on' : ''}" data-dev="1">DEV</button>
    <button class="solid" data-reset="1">RESET</button>`;
  // Surface the full state after every action, per the prototype rules.
  console.log('[prototype state]', {
    devMode: state.devMode, filter: state.filter,
    played: [...state.played], visible: visible().length,
  });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-play],[data-dev],[data-reset],[data-filter]');
  if (!t) return;
  if (t.dataset.play)   return launch(t.dataset.play);
  if (t.dataset.dev)    { state.devMode = !state.devMode; return render(); }
  if (t.dataset.reset)  { state.played = new Set(); return render(); }
  if (t.dataset.filter) { state.filter = t.dataset.filter; return render(); }
});

render();
</script>
</body>
</html>

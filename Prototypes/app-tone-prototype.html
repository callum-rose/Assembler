<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — tone &amp; theme (round 3)</title>
<!--
  ============================================================================
  THROWAWAY PROTOTYPE — not production code. Rewrite properly for uGUI.
  ============================================================================

  ROUND 3 — HOW DARK IS DARK, AND HOW LOUD IS "GAME-LIKE"?

    Three tone variants of the WHOLE app, each in light AND dark, switchable
    via ?tone=a|b|c and ?theme=light|dark and the floating bar:

      A  BROADSHEET     fun dial 1/3 — the settled round-2 design, plus a dark
                        theme and micro-motion only. News first, game second.
      B  LATE EDITION   fun dial 2/3 — newspaper bones, print-shop swagger.
                        Cream/ink, a second accent, an edition ticker, hard
                        offset buttons, rubber-stamp verdicts, odometer score.
      C  ARCADE EDITION fun dial 3/3 — the newspaper becomes the CABINET.
                        Condensed caps, neon duo, scanlined thumbnails, chunky
                        3D buttons, a progress status bar, rank letters.
      D  LETTERPRESS    round 4 — B with the round-3 feedback folded in, and
                        the current default. See below.

  ROUND 4 (D) — THE FEEDBACK, AND WHAT IT COST
    Verdict on round 3: "B mostly. A is too bland, C is too arcadey. Make it
    generally feel a bit more newspaper-y."  Four specific notes, and what each
    one did to the design:

      1. "Don't like the strikethrough on played games — they should just have
         a played icon and be greyed out."
         D drops the highlighter strikethrough entirely. Played art goes to
         full greyscale, and a tick badge sits on the corner of the art.
         NOTE THIS IS A REVERSAL of a round-2 call: round 2 rejected greyscale
         because a desaturated thumbnail on a light ground reads as a broken
         image. The tick is what buys the reversal — it says "played" where
         greyscale alone said "failed to load". If the tick ever gets dropped
         in the uGUI build, the greyscale has to go back to colour-at-42% with
         it. They are one decision, not two.
      2. "The ticker is fun but distracting and doesn't give much useful info."
         Replaced by a STATIC folio row carrying the same three facts. It
         keeps the edition number, which is the one thing nothing else on the
         page shows, and it stops moving.
      3. "C's completed bar is fun but a bit useless."
         Not carried into D at all. Catalogue-completion is meta-progression
         wearing a hat; it was the one place round 3 leaned toward the
         "not in v1" list and it did not earn the line.
      4. "Make it generally feel more newspaper-y."
         D adds print furniture that carries information rather than motion:
         a red kicker rule over the lead, a byline, a drop cap, column rules
         between the grid cells (gap goes to zero — a newspaper's grid is
         defined by its rules, not its gutters), and a folio at the foot.
         B's card numbers went with the ticker: numbering stories is a
         listicle tell, not a newspaper one.

    KEPT FROM B, because that was the part that landed: cream/ink, the rubber
    PLAY stamp on the lead, letterpress offset buttons, the double section
    rule, the stamped verdict and the odometer score on the game-over slip.

    STILL OPEN IN D
      - The drop cap is one line of CSS here and a real problem in uGUI —
        TextMeshPro has no ::first-letter. It needs either a separate glyph
        laid out by hand or <size>/<voffset> rich text. Cheap-looking here,
        not cheap there. Decide whether it survives before it is promised.
      - Column rules assume exactly two columns. A trailing odd card drops its
        rule via :nth-child(odd):last-child, which works here but is the kind
        of thing a uGUI grid will not do for free — the layout needs to know
        about the rules, not paint them per cell.
      - The archive and settings screens are still tone-token-only.

    Round 2 (feed-ux-prototype.html) settled the STRUCTURE — masthead icons,
    lead + 6 + archive, everything goes through detail. Round 3 changes none of
    that. The variants disagree about SURFACE: colour, type, motion, framing
    language, and the shape of the game-over moment. That is deliberate — the
    layout question is closed and re-opening it would waste the round.

  WHAT "MORE FUN" IS NOT ALLOWED TO BE (the constraint that shaped all three)
    The obvious levers for game-feel are meta-progression, and they are all on
    the "not in v1" list already argued out in rounds 1-2:
      - STREAK counters        (ROADMAP: meta-progression, not in v1)
      - SHARE / social         (no social in v1, needs a native plugin)
      - daily CALENDAR archive (a searchable list is what is wanted)
      - difficulty chips       (needs the LLM to self-assess)
    So none of the three variants add a single new persisted number. Fun here
    comes from typography, colour, motion, framing language, and making the
    game-over card an EVENT — all of which are free. The only numbers on
    screen are best-score and play-count, which the app-local store already
    owes us. If a variant looks like it is promising progression it should be
    treated as a bug in the variant, not as a licence to add the feature.

  WHAT EACH VARIANT ACTUALLY CHANGES (so the comparison is legible)
    A  masthead: unchanged. hero: unchanged. buttons: pill.
       motion: press depth, a pulsing "new" dot, score count-up. That is all.
    B  masthead: gains a TICKER strip under the rule (edition no., drop time,
       unplayed count). hero: gains a rotated PLAY stamp + issue kicker.
       cards: numbered 01..06, monospace meta. buttons: hard offset block.
       game over: rubber stamp + odometer.
    C  masthead: date row becomes a STATUS BAR with a segmented progress meter.
       hero: becomes a bezelled CABINET with scanlines. cards: cartridges with
       a rank chip. buttons: chunky 3D with a real press. game over: full-bleed
       result screen with a rank letter.
    Detail / archive / settings / pause deliberately ride the tone TOKENS with
    only small hooks. If the winner is B or C, those screens are where the tone
    is least resolved and the next round should push on them.

  DARK MODE — THE THREE NON-OBVIOUS CALLS
    1. PLAYED CARDS. Round 2 kept the played thumbnail in COLOUR at 42%
       opacity, because greyscale on a light ground reads as a broken image.
       On a dark ground 42% opacity reads as "still loading" instead. Dark
       therefore dims to 55% AND drops saturation, and the headline carries the
       played state through weight and colour rather than the image doing it
       alone. Check this against a real screenshot, not the fake thumbnails.
    2. THE RED. #c8102e is a masthead red on white and a muddy brown on
       #101215. Every tone lifts its accent in dark rather than reusing the
       light value — the accent is a token, not a constant.
    3. THE SHEET AND THE CARD. In light mode the pause sheet and the game-over
       card are white-on-dim, which is most of their drama. In dark they are a
       raised surface, one step lighter than the page, and the drama has to
       come from the border and the shadow instead.

  STILL BLOCKED ON THE SAME SCHEMA AS ROUND 2
    manifest needs publishedAt / thumbnail / channel; InfoDto needs HowToPlay;
    EndGame needs Outcome + Score; GameController.EndGame() must freeze rather
    than Destroy immediately; and best-score / play-count need an app-local
    store. Nothing in round 3 adds to that list — that is on purpose.

  No persistence — tone, theme, played state, scores and settings are in
  memory (tone/theme also ride the URL so a variant is shareable). The yellow
  bar is prototype scaffolding, not part of the design.
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0c0e12; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 28px 16px 170px; overflow-y: auto;
  }

  /* ---- phone frame: density judgements are worthless at desktop width ---- */
  .phone {
    width: 390px; height: 844px; flex: none;
    border-radius: 44px; border: 10px solid #000;
    box-shadow: 0 30px 70px rgba(0,0,0,.65);
    overflow: hidden; position: relative;
    background: var(--paper);
  }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: var(--paper); color: var(--ink); }
  .screen::-webkit-scrollbar { width: 0; }
  .shot > svg { display: block; width: 100%; height: 100%; }

  /* ======================================================================
     TONE + THEME TOKENS
     Set on .phone so the launch overlay (a sibling of .screen) inherits too.

       --paper      page ground
       --surface    raised ground: sheets, cards, inputs, game-over
       --ink        primary text            --ink-2 body   --ink-3 meta
       --rule       hairline                --rule-hard    section / masthead
       --accent     the masthead red equivalent
       --accent-2   the second accent (B and C only; A aliases it to --accent)
       --good/--bad win / lose
       --shot-bg    thumbnail ground while "loading"
       --serif      headline family         --display      loud headline family
     ====================================================================== */

  /* ---- A · BROADSHEET ---- */
  .phone[data-tone="a"] {
    --serif: Georgia, "Times New Roman", serif;
    --display: Georgia, "Times New Roman", serif;
    --radius: 4px;
  }
  .phone[data-tone="a"][data-theme="light"] {
    --paper:#fff; --surface:#fff; --sunk:#f0f2f5;
    --ink:#14161a; --ink-2:#56606d; --ink-3:#a4abb5;
    --rule:#e6e9ee; --rule-hard:#14161a;
    --accent:#c8102e; --accent-2:#c8102e; --on-accent:#fff;
    --good:#16a34a; --bad:#c8102e; --stg:#b45309;
    --shot-bg:#eee; --played-op:.42; --played-sat:1;
    --btn:#14161a; --btn-ink:#fff;
    --shadow:0 8px 24px rgba(16,20,28,.10);
  }
  .phone[data-tone="a"][data-theme="dark"] {
    --paper:#101215; --surface:#181b20; --sunk:#1e2228;
    --ink:#f2f4f7; --ink-2:#a8b0bb; --ink-3:#6f7883;
    --rule:#262a31; --rule-hard:#f2f4f7;
    --accent:#ff4d63; --accent-2:#ff4d63; --on-accent:#14161a;
    --good:#4ade80; --bad:#ff4d63; --stg:#e0a33a;
    --shot-bg:#1e2228; --played-op:.55; --played-sat:.35;
    --btn:#f2f4f7; --btn-ink:#101215;
    --shadow:0 10px 34px rgba(0,0,0,.6);
  }

  /* ---- B · LATE EDITION ---- */
  .phone[data-tone="b"] {
    --serif: Georgia, "Times New Roman", serif;
    --display: "Georgia", "Times New Roman", serif;
    --radius: 2px;
  }
  .phone[data-tone="b"][data-theme="light"] {
    --paper:#faf6ee; --surface:#fffdf8; --sunk:#efe9dd;
    --ink:#17130d; --ink-2:#5b5346; --ink-3:#9c9384;
    --rule:#ded5c5; --rule-hard:#17130d;
    --accent:#d1252b; --accent-2:#f0b400; --on-accent:#fffdf8;
    --good:#1d7a45; --bad:#d1252b; --stg:#9a6212;
    --shot-bg:#e7e0d2; --played-op:.42; --played-sat:1;
    --btn:#17130d; --btn-ink:#faf6ee;
    --shadow:0 8px 24px rgba(35,26,12,.14);
    /* the hard "print" ledge, and the ticker strip, both invert with the theme */
    --offset:#17130d;
    --ticker-bg:#17130d; --ticker-ink:#faf6ee;
  }
  .phone[data-tone="b"][data-theme="dark"] {
    --paper:#13100b; --surface:#1c1811; --sunk:#241f16;
    --ink:#f8f2e5; --ink-2:#b5aa96; --ink-3:#7b7263;
    --rule:#2e281d; --rule-hard:#f8f2e5;
    --accent:#ff5f4d; --accent-2:#ffc633; --on-accent:#13100b;
    --good:#5fd48a; --bad:#ff5f4d; --stg:#e0a33a;
    --shot-bg:#241f16; --played-op:.55; --played-sat:.35;
    --btn:#f8f2e5; --btn-ink:#13100b;
    --shadow:0 10px 34px rgba(0,0,0,.66);
    /* A cream ledge on a near-black page reads as a white border, not depth,
       and a cream ticker becomes the brightest thing on the screen. Both go to
       a raised brown instead — the print metaphor survives, the glare doesn't. */
    --offset:#3d3527;
    --ticker-bg:#241f16; --ticker-ink:#b5aa96;
  }

  /* ---- C · ARCADE EDITION ---- */
  .phone[data-tone="c"] {
    --serif: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
    --display: "Avenir Next Condensed", "Arial Narrow", Impact, system-ui, sans-serif;
    --radius: 10px;
  }
  .phone[data-tone="c"][data-theme="light"] {
    --paper:#f5f3ee; --surface:#fff; --sunk:#e8e5dd;
    --ink:#100c1e; --ink-2:#4c4763; --ink-3:#918ca6;
    --rule:#ddd8ce; --rule-hard:#100c1e;
    --accent:#e5195c; --accent-2:#00b391; --accent-3:#6b4bff; --on-accent:#fff;
    --good:#00996f; --bad:#e5195c; --stg:#a06000;
    --shot-bg:#e0dcd2; --played-op:.42; --played-sat:1;
    --btn:#100c1e; --btn-ink:#fff;
    --shadow:0 8px 24px rgba(16,12,30,.16);
    --glow:none;
  }
  .phone[data-tone="c"][data-theme="dark"] {
    --paper:#0a0814; --surface:#141026; --sunk:#1c1734;
    --ink:#f1eeff; --ink-2:#a49dc8; --ink-3:#6f6893;
    --rule:#241e42; --rule-hard:#f1eeff;
    --accent:#ff2d6f; --accent-2:#23e8b5; --accent-3:#8b6bff; --on-accent:#0a0814;
    --good:#23e8b5; --bad:#ff2d6f; --stg:#e0a33a;
    --shot-bg:#1c1734; --played-op:.5; --played-sat:.4;
    --btn:#ff2d6f; --btn-ink:#0a0814;
    --shadow:0 10px 40px rgba(0,0,0,.7);
    --glow:0 0 22px rgba(255,45,111,.34);
  }
  .phone[data-tone="c"] { --accent-3: var(--accent-3, #6b4bff); }

  /* ---- D · LETTERPRESS (round 4 — B, pushed back toward the newspaper) ----
     Same cream/ink press-room palette as B, because that was the part that
     landed. The second accent survives but is demoted to rules and the drop
     cap; it is no longer allowed to mark up copy. */
  .phone[data-tone="d"] {
    --serif: Georgia, "Times New Roman", serif;
    --display: Georgia, "Times New Roman", serif;
    --radius: 2px;
  }
  .phone[data-tone="d"][data-theme="light"] {
    --paper:#faf6ee; --surface:#fffdf8; --sunk:#efe9dd;
    --ink:#17130d; --ink-2:#4f483d; --ink-3:#948b7c;
    --rule:#d8cfbe; --rule-hard:#17130d;
    --accent:#b8121b; --accent-2:#8a7248; --on-accent:#fffdf8;
    --good:#1d7a45; --bad:#b8121b; --stg:#9a6212;
    --shot-bg:#e7e0d2; --played-op:.5; --played-sat:0;
    --btn:#17130d; --btn-ink:#faf6ee;
    --shadow:0 8px 24px rgba(35,26,12,.14);
    --offset:#17130d;
  }
  .phone[data-tone="d"][data-theme="dark"] {
    --paper:#13100b; --surface:#1c1811; --sunk:#241f16;
    --ink:#f8f2e5; --ink-2:#b5aa96; --ink-3:#7b7263;
    --rule:#312a1f; --rule-hard:#f8f2e5;
    --accent:#e8574a; --accent-2:#c99a3f; --on-accent:#13100b;
    --good:#5fd48a; --bad:#e8574a; --stg:#e0a33a;
    --shot-bg:#241f16; --played-op:.42; --played-sat:0;
    --btn:#f8f2e5; --btn-ink:#13100b;
    --shadow:0 10px 34px rgba(0,0,0,.66);
    --offset:#3d3527;
  }

  /* ======================================================================
     SHARED CHROME — masthead / subhead
     ====================================================================== */
  /* B and C both add a strip under the masthead. Sticking each one separately
     makes them collide at top:0 on scroll, so the whole stack sticks as one. */
  .headstack { position: sticky; top: 0; z-index: 12; background: var(--paper); }
  .masthead {
    background: var(--paper);
    border-bottom: 2px solid var(--rule-hard); padding: 15px 20px 11px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .masthead h1 { margin: 0; font-family: var(--serif); font-size: 24px; letter-spacing: -.02em; font-weight: 700; color: var(--ink); }
  .masthead h1 span { color: var(--accent); }
  .masthead time { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
  .masthead .acts { display: flex; align-items: center; gap: 3px; align-self: center; }
  .masthead .acts button {
    font: inherit; background: none; border: 0; cursor: pointer; padding: 5px 6px;
    border-radius: 6px; color: var(--ink); line-height: 1; font-size: 17px;
    transition: background .12s, transform .12s;
  }
  .masthead .acts button:active { background: var(--sunk); transform: scale(.9); }

  .subhead {
    position: sticky; top: 0; z-index: 12; background: var(--paper);
    border-bottom: 1px solid var(--rule); padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .subhead button.back { font: inherit; background: none; border: 0; cursor: pointer; padding: 4px 6px 4px 0; font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .subhead h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

  /* --- B: the edition ticker, under the masthead rule --- */
  .ticker {
    background: var(--ticker-bg); color: var(--ticker-ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    padding: 6px 0; overflow: hidden; white-space: nowrap;
  }
  .ticker i { display: inline-block; padding-left: 100%; animation: slide 19s linear infinite; font-style: normal; }
  .ticker b { color: var(--accent-2); font-weight: 700; }
  @keyframes slide { to { transform: translateX(-100%); } }

  /* --- C: the status bar, replacing the date row --- */
  .statusbar {
    background: var(--paper);
    border-bottom: 1px solid var(--rule); padding: 9px 20px 10px;
    display: flex; align-items: center; gap: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  }
  .segbar { flex: 1; display: flex; gap: 2px; }
  .segbar i { flex: 1; height: 5px; border-radius: 1px; background: var(--sunk); }
  .segbar i.on { background: var(--accent-2); }
  .statusbar b { color: var(--ink); font-weight: 700; }

  /* ======================================================================
     SCREEN — FEED (shared bones; each tone overrides below)
     ====================================================================== */
  .hero { padding: 18px 20px 22px; }
  .hero .shot { position: relative; width: 100%; height: 172px; border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; background: var(--shot-bg); cursor: pointer; }
  .hero .badge {
    position: absolute; top: 10px; left: 10px;
    background: var(--accent); color: var(--on-accent); font-size: 9.5px; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase; padding: 5px 9px; border-radius: 2px;
  }
  .hero h2 { margin: 0 0 9px; font-family: var(--display); font-size: 26px; line-height: 1.14; letter-spacing: -.022em; font-weight: 700; cursor: pointer; color: var(--ink); }
  .hero p { margin: 0 0 17px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
  .herometa { margin-top: 11px; text-align: center; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

  .playbtn {
    width: 100%; border: 0; cursor: pointer; font: inherit;
    background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 15px;
    font-size: 15px; font-weight: 700; letter-spacing: -.01em;
    transition: transform .09s ease, filter .12s;
  }
  .playbtn:active { transform: translateY(2px) scale(.995); filter: brightness(1.1); }
  .playbtn.done { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); }

  .sechead {
    margin: 0 20px 12px; padding: 14px 0 7px; border-bottom: 1.5px solid var(--rule-hard);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .sechead h4 { margin: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; color: var(--ink); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 13px; padding: 0 20px; }
  /* Flex column + margin-top:auto on the meta keeps the meta lines aligned
     across a row even when headlines wrap to different depths. */
  .card { cursor: pointer; display: flex; flex-direction: column; position: relative; transition: transform .12s ease; }
  .card:active { transform: translateY(2px); }
  .card .shot { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: calc(var(--radius) - 1px); overflow: hidden; background: var(--shot-bg); margin-bottom: 9px; }
  .card h3 { margin: 0 0 5px; font-family: var(--serif); font-size: 15px; line-height: 1.22; font-weight: 700; color: var(--ink); }
  .card p { margin: 0 0 7px; font-size: 12px; line-height: 1.4; color: var(--ink-2); opacity: .82; }
  .card .meta { margin-top: auto; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }

  /* Played state. In dark the image also desaturates — 42% opacity alone on a
     dark ground reads as "still loading" rather than "already played". */
  .card.played .shot, .row.played .shot { opacity: var(--played-op); filter: saturate(var(--played-sat)); }
  .card.played h3 { color: var(--ink-3); font-weight: 400; }
  .card.played p { color: var(--ink-3); opacity: .7; }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.78); } }
  .tick { color: var(--good); font-weight: 800; font-size: 11px; }
  .stg { color: var(--stg); font-weight: 700; }

  .seeall {
    margin: 30px 20px 34px; width: calc(100% - 40px);
    font: inherit; cursor: pointer; background: none;
    border: 1.5px solid var(--rule-hard); border-radius: 999px; padding: 14px;
    font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    transition: transform .09s;
  }
  .seeall:active { transform: translateY(2px); }

  /* ======================================================================
     TONE B OVERRIDES — LATE EDITION
     Print-shop: hard offset shadows instead of soft ones, a rubber stamp on
     the lead, numbered cards, monospace meta.
     ====================================================================== */
  [data-tone="b"] .masthead h1 { letter-spacing: -.03em; }
  [data-tone="b"] .hero .badge { display: none; }
  [data-tone="b"] .hero .shot { box-shadow: 4px 4px 0 var(--offset); }
  /* unscoped — B and D both stamp the lead; only their heroes emit it */
  .stamp {
    position: absolute; right: 10px; bottom: 10px; z-index: 2;
    border: 2.5px solid var(--accent); color: var(--accent);
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 800;
    letter-spacing: .18em; padding: 6px 10px; border-radius: 3px;
    transform: rotate(-8deg); background: rgba(255,255,255,.08);
    backdrop-filter: blur(2px); animation: stamp .4s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes stamp { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
  [data-tone="b"] .kicker-issue {
    font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px;
    display: flex; align-items: center; gap: 7px;
  }
  [data-tone="b"] .kicker-issue b { color: var(--accent); font-weight: 800; }
  [data-tone="b"] .playbtn {
    border-radius: 2px; box-shadow: 4px 4px 0 var(--accent);
    text-transform: uppercase; letter-spacing: .12em; font-size: 13px; font-weight: 800;
  }
  [data-tone="b"] .playbtn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--accent); }
  [data-tone="b"] .playbtn.done { box-shadow: 4px 4px 0 var(--rule), inset 0 0 0 1.5px var(--rule); }
  [data-tone="b"] .sechead { border-bottom-width: 4px; border-bottom-style: double; }
  [data-tone="b"] .sechead h4 { font-family: ui-monospace, Menlo, monospace; }
  [data-tone="b"] .card .meta, [data-tone="b"] .row .meta { font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; }
  [data-tone="b"] .idx {
    position: absolute; top: -3px; left: -3px; z-index: 2;
    background: var(--ticker-bg); color: var(--ticker-ink);
    font-family: ui-monospace, Menlo, monospace; font-size: 9px; font-weight: 700;
    padding: 3px 5px; letter-spacing: .06em;
  }
  [data-tone="b"] .card .shot { box-shadow: 3px 3px 0 var(--rule); }
  [data-tone="b"] .card.played h3 { text-decoration: line-through; text-decoration-color: var(--accent-2); text-decoration-thickness: 2px; }
  [data-tone="b"] .seeall { border-radius: 2px; box-shadow: 4px 4px 0 var(--accent-2); }
  [data-tone="b"] .seeall:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--accent-2); }

  /* ======================================================================
     TONE C OVERRIDES — ARCADE EDITION
     The newspaper becomes the cabinet. Condensed caps, neon duo, scanlines,
     chunky 3D buttons with a real press.
     ====================================================================== */
  [data-tone="c"] .masthead { border-bottom-width: 3px; }
  [data-tone="c"] .masthead h1 {
    text-transform: uppercase; letter-spacing: .01em; font-weight: 800; font-size: 25px;
    text-shadow: var(--glow);
  }
  [data-tone="c"] .hero { padding-top: 14px; }
  /* the cabinet: a bezelled panel the lead sits inside */
  [data-tone="c"] .cabinet {
    border: 2px solid var(--rule); border-radius: 14px; padding: 12px 12px 16px;
    background: var(--surface); box-shadow: var(--shadow);
  }
  [data-tone="c"][data-theme="dark"] .cabinet { border-color: var(--accent-3); box-shadow: var(--shadow), 0 0 0 1px rgba(139,107,255,.25) inset; }
  [data-tone="c"] .hero .shot { height: 158px; border-radius: 8px; }
  /* scanlines — cheap CRT read, and it hides how synthetic the fake thumbs are */
  [data-tone="c"] .shot::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.20) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  [data-tone="c"] .hero .badge {
    border-radius: 999px; letter-spacing: .2em; padding: 5px 11px;
    box-shadow: var(--glow); animation: flick 3.2s steps(1) infinite;
  }
  @keyframes flick { 0%,92%,100% { opacity: 1; } 94% { opacity: .35; } 96% { opacity: 1; } 98% { opacity: .5; } }
  [data-tone="c"] .hero h2 { text-transform: uppercase; font-weight: 800; letter-spacing: -.005em; font-size: 28px; line-height: 1.05; }
  [data-tone="c"] .hero p { font-size: 13.5px; }
  /* chunky 3D button: the shadow IS the depth, and pressing consumes it */
  [data-tone="c"] .playbtn {
    border-radius: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; font-size: 14px;
    background: var(--accent); color: var(--on-accent);
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 62%, #000), var(--glow);
  }
  [data-tone="c"] .playbtn:active { transform: translateY(5px); box-shadow: 0 0 0 color-mix(in srgb, var(--accent) 62%, #000); filter: none; }
  [data-tone="c"] .playbtn.done {
    background: var(--surface); color: var(--ink);
    box-shadow: 0 5px 0 var(--rule), inset 0 0 0 2px var(--rule);
  }
  [data-tone="c"] .sechead { border-bottom: 2px solid var(--accent-3); }
  [data-tone="c"] .sechead h4 { letter-spacing: .22em; color: var(--ink-2); }
  [data-tone="c"] .grid { gap: 16px 12px; }
  [data-tone="c"] .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 8px 10px; }
  [data-tone="c"] .card:active { transform: translateY(3px); }
  [data-tone="c"] .card h3 { text-transform: uppercase; font-weight: 800; font-size: 14px; line-height: 1.1; letter-spacing: 0; }
  [data-tone="c"] .card p { display: none; }   /* the cartridge shelf is art + title, not prose */
  [data-tone="c"] .card .meta { font-family: ui-monospace, Menlo, monospace; font-size: 9px; }
  [data-tone="c"] .rank {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    background: var(--accent-2); color: var(--on-accent);
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 800;
  }
  [data-tone="c"] .seeall {
    border: 0; border-radius: 12px; background: var(--accent-3); color: #fff;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent-3) 60%, #000);
  }
  [data-tone="c"] .seeall:active { transform: translateY(5px); box-shadow: 0 0 0 color-mix(in srgb, var(--accent-3) 60%, #000); }

  /* ======================================================================
     TONE D OVERRIDES — LETTERPRESS  (round 4)

     B kept: cream/ink, the PLAY stamp, letterpress offset buttons, the double
     section rule. B lost: the ticker (motion with no information), the
     numbered cards (a listicle tell, not a newspaper one) and the highlighter
     strikethrough on played headlines.

     Added to push it back toward print: a static folio row instead of the
     ticker, a red kicker rule over the lead, a byline, an italic standfirst,
     a drop cap, column rules between the grid cells, and a folio at the foot.
     ====================================================================== */
  [data-tone="d"] .masthead { border-bottom-width: 3px; padding-bottom: 9px; }
  [data-tone="d"] .masthead h1 { letter-spacing: -.03em; font-size: 27px; }
  [data-tone="d"] .masthead time { display: none; }   /* the date moves to the folio row */

  /* The folio row replaces B's marquee. Same three facts, no motion, and it
     earns its line by being the only place the edition number lives. */
  .folio-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 20px 8px; border-bottom: 1px solid var(--rule-hard);
    font-family: var(--serif); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-2); background: var(--paper);
  }
  .folio-row b { font-weight: 700; color: var(--accent); }

  /* lead: kicker rule, headline, byline, stamped art, drop-capped copy */
  [data-tone="d"] .hero { padding-top: 20px; }
  [data-tone="d"] .hero .badge { display: none; }
  .kicker-rule {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    font-family: var(--serif); font-size: 10.5px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
  }
  .kicker-rule::after { content: ''; flex: 1; height: 1px; background: var(--accent); opacity: .35; }
  [data-tone="d"] .hero h2 { font-size: 30px; line-height: 1.08; letter-spacing: -.025em; margin-bottom: 10px; }
  .byline {
    font-family: var(--serif); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3);
    padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--rule);
  }
  [data-tone="d"] .hero .shot { box-shadow: 4px 4px 0 var(--offset); margin-bottom: 16px; }
  /* Drop cap. ::first-letter only takes a float on a block, hence the <p>. */
  [data-tone="d"] .hero p { font-family: var(--serif); font-size: 15px; line-height: 1.52; color: var(--ink-2); }
  [data-tone="d"] .hero p::first-letter {
    float: left; font-family: var(--serif); font-weight: 700; color: var(--accent);
    font-size: 47px; line-height: .78; padding: 5px 8px 0 0;
  }
  [data-tone="d"] .playbtn {
    border-radius: 2px; box-shadow: 4px 4px 0 var(--accent);
    text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 800;
    font-family: var(--serif);
  }
  [data-tone="d"] .playbtn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--accent); }
  [data-tone="d"] .playbtn.done { box-shadow: 4px 4px 0 var(--rule), inset 0 0 0 1.5px var(--rule); }

  [data-tone="d"] .sechead { border-bottom-width: 4px; border-bottom-style: double; }
  [data-tone="d"] .sechead h4 { font-family: var(--serif); letter-spacing: .2em; }

  /* Column rules. A newspaper's grid is defined by the rules between the
     cells, not by the gaps — so the gap goes to zero and the cells rule. */
  [data-tone="d"] .grid { gap: 0; }
  [data-tone="d"] .card { padding: 15px 0 17px; }
  [data-tone="d"] .card:nth-child(odd) { padding-right: 14px; border-right: 1px solid var(--rule); }
  [data-tone="d"] .card:nth-child(even) { padding-left: 14px; }
  /* an odd-length grid would otherwise hang a rule with nothing beside it */
  [data-tone="d"] .card:nth-child(odd):last-child { border-right: 0; }
  [data-tone="d"] .card:nth-child(n+3) { border-top: 1px solid var(--rule); }
  [data-tone="d"] .card h3 { font-size: 15.5px; line-height: 1.18; letter-spacing: -.012em; }
  [data-tone="d"] .card p { font-family: var(--serif); font-size: 12.5px; line-height: 1.42; }
  [data-tone="d"] .card .meta, [data-tone="d"] .row .meta { font-family: var(--serif); letter-spacing: .11em; }

  /* PLAYED — greyed out plus an explicit mark, no strikethrough.
     The mark is what makes greyscale safe: round 2 rejected greyscale because
     a desaturated thumbnail on a light ground reads as a broken image, and the
     tick is the thing that says "played" instead of "failed to load". */
  /* The grey goes on the ART, not on .shot — the tick badge is a child of
     .shot, and filtering the container fades the mark along with the image,
     which is precisely the "broken image" read the mark exists to prevent. */
  [data-tone="d"] .card.played .shot, [data-tone="d"] .row.played .shot { filter: none; opacity: 1; }
  [data-tone="d"] .card.played .shot > svg, [data-tone="d"] .row.played .shot > svg {
    filter: grayscale(1); opacity: var(--played-op);
  }
  [data-tone="d"] .card.played h3, [data-tone="d"] .row.played h3 { color: var(--ink-3); font-weight: 400; text-decoration: none; }
  [data-tone="d"] .card.played p { color: var(--ink-3); opacity: .62; }
  .pmark {
    position: absolute; top: 6px; left: 6px; z-index: 3;
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    background: var(--ink); color: var(--paper); font-size: 10px; font-weight: 800; line-height: 1;
  }
  .row .pmark { width: 15px; height: 15px; font-size: 8.5px; top: 3px; left: 3px; }

  [data-tone="d"] .seeall { border-radius: 2px; font-family: var(--serif); box-shadow: 4px 4px 0 var(--rule); }
  [data-tone="d"] .seeall:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--rule); }

  /* the foot-of-page folio — the last print tell, and free */
  .folio-foot {
    padding: 0 20px 34px; text-align: center;
    font-family: var(--serif); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
  }

  /* detail + pause pick up the same print furniture */
  [data-tone="d"] .detail h2 { font-size: 29px; line-height: 1.1; }
  [data-tone="d"] .detail .desc { font-family: var(--serif); }
  [data-tone="d"] .htp { border-left: 3px solid var(--accent); background: var(--surface); }
  [data-tone="d"] .htp h5 { font-family: var(--serif); }
  [data-tone="d"] .sheetbtn { border-radius: 2px; font-family: var(--serif); }
  [data-tone="d"] .sheetbtn.primary { box-shadow: 4px 4px 0 var(--accent); }
  [data-tone="d"] .sheetbtn.primary:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--accent); }

  /* game over = a result slip: ruled box, stamped verdict, odometer score */
  [data-tone="d"] .over { border-radius: 2px; box-shadow: 8px 8px 0 var(--accent); border: 1px solid var(--rule-hard); }
  [data-tone="d"] .over .slipkicker {
    font-family: var(--serif); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-3); padding-bottom: 11px; margin-bottom: 16px; border-bottom: 3px double var(--rule-hard);
  }
  [data-tone="d"] .over .verdict {
    display: inline-block; border: 3px solid currentColor; border-radius: 3px;
    padding: 6px 16px; text-transform: uppercase; font-family: var(--serif);
    font-size: 21px; font-weight: 800; letter-spacing: .1em; transform: rotate(-4deg);
    animation: stampbig .38s cubic-bezier(.2,1.6,.4,1) both; margin-bottom: 13px;
  }
  [data-tone="d"] .over .score { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  [data-tone="d"] .over .btns { padding-top: 4px; border-top: 1px solid var(--rule); }

  /* ======================================================================
     SCREEN — GAME DETAIL
     ====================================================================== */
  .detail .shot { position: relative; width: 100%; height: 210px; overflow: hidden; background: var(--shot-bg); }
  .detail .body { padding: 20px 20px 30px; }
  .detail .kicker { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .detail h2 { margin: 0 0 12px; font-family: var(--display); font-size: 27px; line-height: 1.14; letter-spacing: -.022em; font-weight: 700; color: var(--ink); }
  .detail .desc { margin: 0 0 22px; font-size: 15px; line-height: 1.58; color: var(--ink-2); }
  [data-tone="c"] .detail h2 { text-transform: uppercase; font-weight: 800; letter-spacing: 0; line-height: 1.05; font-size: 30px; }

  .htp { border: 1px solid var(--rule); border-radius: var(--radius); padding: 15px 16px 16px; margin-bottom: 20px; background: var(--surface); }
  .htp h5 { margin: 0 0 11px; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
  .htp ul { margin: 0; padding: 0; list-style: none; }
  .htp li { font-size: 13.5px; line-height: 1.45; color: var(--ink); display: flex; gap: 9px; margin-bottom: 8px; }
  .htp li:last-child { margin-bottom: 0; }
  .htp li b { flex: none; color: var(--accent); font-weight: 800; font-size: 11px; line-height: 1.75; }
  [data-tone="b"] .htp { border-left: 3px solid var(--accent-2); }
  [data-tone="c"] .htp li b { color: var(--accent-2); }

  .statrow { display: flex; gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 22px; }
  .statrow div { flex: 1; padding: 13px 4px; text-align: center; }
  .statrow div + div { border-left: 1px solid var(--rule); }
  .statrow b { display: block; font-family: var(--display); font-size: 19px; font-weight: 700; margin-bottom: 3px; color: var(--ink); }
  .statrow span { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .statrow.unplayed b { color: var(--ink-3); opacity: .5; }
  [data-tone="c"] .statrow b { font-family: ui-monospace, Menlo, monospace; color: var(--accent-2); font-size: 21px; }

  /* ======================================================================
     SCREEN — ARCHIVE (a dense LIST, not the feed's grid)
     ====================================================================== */
  .searchwrap { padding: 14px 16px 10px; position: sticky; top: 45px; z-index: 11; background: var(--paper); }
  .search { display: flex; align-items: center; gap: 8px; background: var(--sunk); border-radius: 10px; padding: 10px 12px; }
  .search input { flex: 1; font: inherit; font-size: 15px; border: 0; background: none; outline: none; color: var(--ink); min-width: 0; }
  .search input::placeholder { color: var(--ink-3); }
  .search .clr { font: inherit; border: 0; background: var(--ink-3); color: var(--paper); cursor: pointer; border-radius: 50%; width: 18px; height: 18px; line-height: 1; font-size: 12px; padding: 0; flex: none; }

  .filter { display: flex; align-items: center; gap: 3px; padding: 4px 16px 10px; }
  .filter button {
    font: inherit; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    background: none; border: 0; cursor: pointer; color: var(--ink-3); padding: 5px 9px; border-radius: 999px; white-space: nowrap;
  }
  .filter button.on { color: var(--btn-ink); background: var(--btn); }
  .archcount { padding: 0 16px 8px; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

  .row { display: flex; align-items: center; gap: 13px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid var(--rule); }
  .row:active { background: var(--sunk); }
  .row .shot { position: relative; width: 64px; height: 46px; flex: none; border-radius: 3px; overflow: hidden; background: var(--shot-bg); }
  .row .txt { min-width: 0; flex: 1; }
  .row h3 { margin: 0 0 3px; font-family: var(--serif); font-size: 14.5px; line-height: 1.22; font-weight: 700; color: var(--ink); }
  .row .meta { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .row.played h3 { color: var(--ink-3); font-weight: 400; }
  .row .chev { color: var(--ink-3); opacity: .5; font-size: 16px; flex: none; }
  [data-tone="c"] .row h3 { text-transform: uppercase; font-weight: 800; }

  .empty { padding: 54px 24px; text-align: center; }
  .empty b { display: block; font-family: var(--display); font-size: 19px; margin-bottom: 6px; color: var(--ink); }
  .empty span { font-size: 13px; color: var(--ink-3); line-height: 1.5; }

  /* ======================================================================
     SCREEN — SETTINGS
     ====================================================================== */
  .setgroup { margin: 22px 0 0; }
  .setgroup > h5 { margin: 0 16px 8px; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
  .setrow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--rule); background: var(--surface); }
  .setgroup .setrow:last-child { border-bottom: 1px solid var(--rule); }
  .setrow .txt { flex: 1; min-width: 0; }
  .setrow b { display: block; font-size: 14.5px; font-weight: 600; margin-bottom: 2px; color: var(--ink); }
  .setrow small { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; display: block; }
  .setrow.tap { cursor: pointer; }
  .setrow.tap:active { background: var(--sunk); }
  .setrow .chev { color: var(--ink-3); opacity: .5; font-size: 16px; }
  .setrow .val { font-size: 13px; color: var(--ink-3); }
  .setrow.danger b { color: var(--bad); }

  .toggle { width: 46px; height: 28px; border-radius: 999px; background: var(--sunk); position: relative; cursor: pointer; border: 0; padding: 0; flex: none; transition: background .15s; }
  .toggle i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .18s cubic-bezier(.3,1.4,.5,1); }
  .toggle.on { background: var(--good); }
  .toggle.on i { transform: translateX(18px); }

  /* Theme row lives in Settings as well as the dev bar — the point of a dark
     mode prototype is partly "where does the user find the switch". */
  .segctl { display: flex; gap: 0; background: var(--sunk); border-radius: 8px; padding: 2px; flex: none; }
  .segctl button {
    font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 6px 10px; border-radius: 6px;
  }
  .segctl button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.2); }

  .about { padding: 24px 16px 40px; text-align: center; font-size: 11px; color: var(--ink-3); line-height: 1.7; }

  /* ======================================================================
     IN-GAME — launch, shell strip, pause sheet, game-over
     ====================================================================== */
  .launch {
    position: absolute; inset: 0; z-index: 50; background: #06070a; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px;
  }
  .launch.loading { text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .launch h4 { margin: 0; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; font-weight: 600; }
  .launch p { margin: 0; font-size: 13px; opacity: .5; }
  .bar { width: 190px; height: 3px; background: #24262e; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .55s ease; }
  /* C dresses the load as an attract screen — same 750ms, different promise */
  [data-tone="c"] .launch.loading h4 { animation: blink 1s steps(1) infinite; opacity: 1; color: var(--accent-2); }
  @keyframes blink { 50% { opacity: .15; } }

  .fakegame { position: absolute; inset: 0; background: #0d1018; display: flex; flex-direction: column; }
  .gamestrip {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 16px 18px 12px; color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: .1em;
  }
  .gamestrip .pausebtn { font: inherit; font-size: 16px; background: rgba(255,255,255,.12); border: 0; color: #fff; cursor: pointer; border-radius: 8px; width: 34px; height: 34px; line-height: 1; flex: none; }
  .gamestrip .hud { flex: 1; display: flex; justify-content: space-between; opacity: .75; }
  .gamestrip .hud em { font-style: normal; opacity: .45; }
  .playfield { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .playfield .stage { width: 220px; height: 220px; border: 1px solid #232838; border-radius: 12px; position: relative; overflow: hidden; }
  .playfield .stage b { position: absolute; width: 26px; height: 26px; border-radius: 6px; background: #4ea1ff; left: 24px; top: 96px; animation: bob 1.1s ease-in-out infinite alternate; }

<script>
// ===========================================================================
// TONE VARIANTS — the thing this round is asking about
// ===========================================================================
const TONES = {
  a: { key:'a', name:'Broadsheet',     dial:'fun 1/3',
       blurb:'The settled round-2 design, given a dark theme and micro-motion only. Press depth, a pulsing "new" dot, a score that counts up. Nothing else moves.',

       blurb:'The newspaper becomes the cabinet: condensed caps, a neon duo, scanlined thumbnails, cartridge cards, chunky 3D buttons and a full-screen result with a rank letter.',
       why:'Loudest, and the only one where the game-over card is an event. The risk is that the masthead is now decoration rather than identity — judge it on the feed, not the result screen.' },
  d: { key:'d', name:'Letterpress',    dial:'fun 2/3, newspaper-first',
       blurb:'B with the feedback folded in. Kept: cream/ink, the PLAY stamp, letterpress buttons, the double section rule. Cut: the ticker, the card numbers, the strikethrough. Added: a static folio row, a red kicker rule, a byline, a drop cap, column rules between the grid cells, and a folio at the foot.',
       why:'The print furniture does the work the motion was doing in B, and it carries information instead of just moving. This is the one to beat.' },

// ===========================================================================
// MOCK DATA — unchanged from round 2 so the tones are compared on the same
// content. Headlines are OUR rewrites of the story hook, never the outlet's.
// ===========================================================================
const TODAY = '2026-07-31';

const GAMES = [
  { id:'capsule-catch', title:'Mars Sample Capsule Comes Home', date:'2026-07-31', time:'07:02', played:false, channel:'live',
    desc:'A decade of Martian rock is falling through the atmosphere at four kilometres a second. Bleed off speed at the right moment and put the capsule inside the recovery ring before it runs out of sky.',
    howToPlay:['Drag anywhere to steer the capsule','Hold to deploy the drogue chute','Land inside the ring — tighter scores higher'] },
  { id:'grid-balance', title:'Heatwave Pushes The Grid To A Record', date:'2026-07-30', time:'06:58', played:false, channel:'live',
    desc:'Demand is climbing faster than anything you can switch on. Juggle supply against load across the afternoon peak — brown out once and the run is over.',
    howToPlay:['Tap a station to bring it online','Swipe down on a station to throttle it back','Keep the frequency needle out of the red'] },
  { id:'rate-runner', title:'Central Bank Holds Rates A Fifth Time', date:'2026-07-29', time:'07:11', played:true, channel:'live',

  { id:'detour', title:'Old Town Closes To Cars', date:'2026-07-20', time:'06:44', played:true, channel:'live',
    desc:'Six streets went pedestrian at midnight and nobody told the traffic. Reroute the flow before the queues reach the ring road.',
    howToPlay:['Drag to place a diversion arrow','Tap an arrow to rotate it','Every wrong turn adds to the queue'] },
  { id:'blitz-clock', title:'Teen Challenger Topples The Champion', date:'2026-07-19', time:'07:01', played:true, channel:'live',

  // Staging = published by the daemon, not yet promoted. Dev-mode only (SHIPPLAN #7).
  { id:'tide-line', title:'Record Tide Reshapes The Estuary', date:'2026-07-31', time:'09:40', played:false, channel:'staging',
    desc:'The highest water in forty years is rearranging a sandbank that a shipping lane depends on. Bank the bars before the next surge takes them.',
    howToPlay:['Drag sediment along the channel','Bars settle where the current slows','Survive three surges'] },

const FEED_LIMIT = 6;

// ===========================================================================
// STATE — in memory only. tone + theme also ride the URL so a variant is
// shareable and reload-stable; nothing else persists.
// ===========================================================================
const params = new URLSearchParams(location.search);
const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;

const state = {
  // D is the default — it is the current best guess, and A/B/C are the record.
  tone: TONES[params.get('tone')] ? params.get('tone') : 'd',
  theme: ['light','dark'].includes(params.get('theme')) ? params.get('theme') : (prefersDark ? 'dark' : 'light'),
  stats: {},               // id -> { plays, best } — stands in for the app-local store
  devMode: false,
  filter: 'all',
  search: '',
  route: { name: 'feed' }, // { name, id?, from? }
};

function seedStats() {
  state.stats = {};
  GAMES.filter(g => g.played).forEach((g, i) => {
    state.stats[g.id] = { plays: 1 + (i % 3), best: 2400 + ((hash(g.id) % 90) * 97) };
  });
}

const SCREEN_NAMES = { feed: 'Feed', archive: 'Archive', settings: 'Settings' };
const tone = () => TONES[state.tone];

function syncUrl() {
  const p = new URLSearchParams({ tone: state.tone, theme: state.theme });
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

// ===========================================================================
// THUMBNAILS — stand-ins for the sandbox auto-screenshot (SHIPPLAN #9).
// Deterministic per id. Saturation and ground shift with the theme so a fake
// screenshot does not flatter light mode and wreck dark.
// ===========================================================================
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function thumb(id) {
  const h = hash(id);
  let seed = h || 1;
  const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
  const hue = h % 360, hue2 = (hue + 40 + h % 60) % 360;
  // Arcade pushes the chroma; broadsheet/late-edition keep the screenshots muted.
  const sat = state.tone === 'c' ? 92 : 82;
  const groundL = state.theme === 'dark' ? [18, 9] : [24, 13];
  const shapes = [];
  for (let i = 0; i < 11; i++) {
    const x = 2 + rnd() * 96, y = 2 + rnd() * 96, s = 5 + rnd() * 17, r = rnd();
    shapes.push((r < 0.34)
      ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(s / 2).toFixed(1)}" fill="hsl(${hue2} ${sat}% ${(56 + rnd() * 20).toFixed(0)}%)" opacity=".9"/>`
      : `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${s.toFixed(1)}" height="${(s * (0.5 + rnd())).toFixed(1)}" rx="2" fill="hsl(${hue2} ${sat - 4}% ${(48 + rnd() * 28).toFixed(0)}%)" opacity=".88"/>`);
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(${hue} 45% ${groundL[0]}%)"/><stop offset="1" stop-color="hsl(${hue2} 55% ${groundL[1]}%)"/>
    </linearGradient></defs>
    <rect width="100" height="100" fill="url(#g${h})"/>${shapes.join('')}</svg>`;
}

// ===========================================================================
// HELPERS
// ===========================================================================
const statsFor = id => state.stats[id] ?? { plays: 0, best: 0 };
const isPlayed = g => statsFor(g.id).plays > 0;
const visible = () => GAMES.filter(g => state.devMode || g.channel === 'live');
const sorted = () => [...visible()].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
const leadGame = () => sorted().find(g => g.channel === 'live');
const gameById = id => GAMES.find(g => g.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const daysAgo = date => Math.round((new Date(TODAY) - new Date(date)) / 864e5);
const longDate = date => new Date(date + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fullDate = date => new Date(date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
function relDay(date) {
  const d = daysAgo(date);
  return d === 0 ? 'Today' : d === 1 ? 'Yesterday' : d < 7 ? `${d} days ago` : longDate(date);
}
const num = n => n.toLocaleString('en-GB');

// Rank letter for tone C. Derived from the score that already exists — it is
// NOT a new persisted number, and deliberately so (see the header comment).
const RANKS = [[8500,'S'],[6500,'A'],[4500,'B'],[2500,'C'],[0,'D']];
const rankFor = score => RANKS.find(([min]) => score >= min)[1];

function go(name, id) {
  const from = name !== 'detail' ? 'feed'
    : state.route.name === 'detail' ? state.route.from
    : state.route.name;
  state.route = { name, id, from };
  document.getElementById('screen').scrollTop = 0;
  render();
}

// ===========================================================================
// SHARED FRAGMENTS
// ===========================================================================
// Navigation is unchanged from round 2: two masthead icons, feed only.
// Tone C swaps the dateline for a status bar, so the masthead loses its <time>.
function Masthead() {
  const t = state.tone;
  return `<div class="headstack">
      <div class="masthead">
        <div>
          <h1>The Daily <span>Build</span></h1>
          ${t === 'c' ? '' : `<time>${fullDate(TODAY)}</time>`}
        </div>
        <div class="acts">
          <button data-go="archive" title="Archive">&#128269;</button>
          <button data-go="settings" title="Settings">&#9881;&#65039;</button>
        </div>
      </div>
      ${t === 'b' ? Ticker() : ''}
      ${t === 'c' ? StatusBar() : ''}
      ${t === 'd' ? FolioRow() : ''}
    </div>`;
}

// B — the edition ticker. Says nothing the feed does not already say; it is
// there to make the page feel like it is being printed rather than served.
function Ticker() {
  const unplayed = visible().filter(g => !isPlayed(g)).length;
  const lead = leadGame();
  const line = `EDITION No. ${214 + daysAgo('2026-07-31') * -1} &middot; PRESSED ${lead.time} &middot; <b>${unplayed} UNPLAYED</b> &middot; ${fullDate(TODAY).toUpperCase()} &middot; ALL GAMES GENERATED OVERNIGHT &middot;&nbsp;`;
  return `<div class="ticker"><i>${line}${line}</i></div>`;
}

// C — the status bar. A progress meter over the whole catalogue, built from
// play counts we already have. No streak, no new number.
function StatusBar() {
  const all = visible(), done = all.filter(isPlayed).length;
  const segs = all.map((g, i) => `<i class="${isPlayed(g) ? 'on' : ''}"></i>`).join('');
  return `<div class="statusbar">
    <span><b>${done}</b>/${all.length} cleared</span>
    <span class="segbar">${segs}</span>
    <span>${fullDate(TODAY).slice(0, 3).toUpperCase()}</span>
  </div>`;
}

// D — the folio row. Replaces B's ticker: the same three facts, static, and it
// carries the one thing nothing else on the page shows (the edition number).
function FolioRow() {
  const unplayed = visible().filter(g => !isPlayed(g)).length;
  return `<div class="folio-row">
    <span>No. ${214 - daysAgo(TODAY)}</span>
    <span>${fullDate(TODAY)}</span>

function SubHead(title) {
  const back = SCREEN_NAMES[state.route.from] ?? 'Feed';
  return `<div class="subhead">
    <button class="back" data-back="1">&#8249;&nbsp;${back}</button>

}

function HowToPlay(game, heading = 'How to play') {
  return `<div class="htp">
    <h5>${heading}</h5>

// ===========================================================================
// SCREEN — FEED
// One function per tone. They share the section head and the archive button
// and nothing else — the hero and the card are where the tone actually lives.
// ===========================================================================
function Feed() {
  const lead = leadGame();
  const rest = sorted().filter(g => g !== lead);
  const shown = rest.slice(0, FEED_LIMIT);
  const total = visible().length;
  const hero = { a: HeroA, b: HeroB, c: HeroC, d: HeroD }[state.tone](lead);
  const card = { a: CardA, b: CardB, c: CardC, d: CardD }[state.tone];
  const sec  = { a: 'Earlier', b: 'Earlier editions', c: '&#9664; Back catalogue &#9654;',
                 d: 'Earlier editions' }[state.tone];
  const arch = { a: `Archive &mdash; all ${total} games &#9656;`,
                 b: `Open the archive &mdash; ${total} editions`,
                 c: `Back catalogue &middot; ${total} &#9656;`,
                 d: `Open the archive &mdash; ${total} editions` }[state.tone];

  return `${Masthead()}
    ${hero}
    ${shown.length ? `
      <div class="sechead"><h4>${sec}</h4></div>
      <div class="grid">${shown.map(card).join('')}</div>` : ''}
    <button class="seeall" data-go="archive">${arch}</button>
    ${state.tone === 'd'
      ? `<div class="folio-foot">The Daily Build &middot; No. ${214 - daysAgo(TODAY)} &middot; Page 1</div>`
      : ''}`;
}

// ===========================================================================
// IN-GAME — download, play, pause, game over
// ===========================================================================
let session = null;   // { id, paused }

function launch(id) {
  const game = gameById(id);
  session = { id, paused: false };

  const head = { a: 'Fetching descriptor', b: 'Setting the press', c: 'Insert coin', d: 'Setting the press' }[state.tone];

  const overlay = document.createElement('div');
  overlay.className = 'launch loading';
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <h4>${head}</h4>
    <div class="bar"><i></i></div>
    <p>${esc(game.id)}/descriptor.yaml &middot; v3 &middot; 41 KB</p>`;
  document.getElementById('phone').appendChild(overlay);
  requestAnimationFrame(() => overlay.querySelector('.bar i').style.width = '100%');

  setTimeout(() => renderGame(), 750);
}

// The pause sheet and the game-over card both sit OVER a frozen game, never over
// a blank screen — GameController.EndGame() is to stop the clock and leave the
// final frame standing rather than Destroy() it.
function renderGame(over) {
  const overlay = document.getElementById('overlay');
  if (!overlay) return;
  const frozen = session.paused || over;
  overlay.className = 'launch';
  overlay.innerHTML = `
    <div class="fakegame ${frozen ? 'paused' : ''}">
      <div class="gamestrip">
        <button class="pausebtn" data-pause="1" ${over ? 'disabled' : ''}>&#10073;&#10073;</button>
        <div class="hud"><span><em>SCORE</em> 1,240</span><span><em>TIME</em> 0:45</span></div>
      </div>
      <div class="playfield">
        <div class="stage"><b></b><s></s></div>
        ${over ? '' : `<div class="endbtns">
          <button data-end="win">Reach !gameover (win)</button>
          <button data-end="lose">Reach !gameover (lose)</button>
          <button data-end="none">Legacy descriptor (no outcome)</button>
        </div>`}
      </div>
    </div>
    ${session.paused ? PauseSheet() : ''}
    ${over ?? ''}`;

  if (over) countUp();
}

// "How to play" reuses the detail page's block verbatim — the single strongest
// argument for authoring it in the descriptor rather than deriving it.
function PauseSheet() {
  const g = gameById(session.id);
  const title = { a: 'Paused', b: 'Held for press', c: 'Paused', d: 'Held for press' }[state.tone];
  return `<div class="sheetwrap" data-resume="1">
    <div class="sheet" data-stop="1">
      <div class="grab"></div>
      <h3>${title}</h3>
      <p class="sub">${esc(g.title)}</p>
      ${HowToPlay(g, 'Controls')}
      <div class="btns">
        <button class="sheetbtn primary" data-resume="1">Resume</button>
        <button class="sheetbtn" data-restart="1">Restart</button>
        <button class="sheetbtn quiet" data-quit="1">Quit to feed</button>
      </div>
    </div>
  </div>`;
}

// --- game over -------------------------------------------------------------
// Three states, matching the EndGame schema decision:
//   outcome 'win'  -> positive verdict + score
//   outcome 'lose' -> negative verdict + score
//   outcome null   -> plain "Game Over", no score (every existing descriptor)
// The card is the loudest thing each tone does, so it is written per tone.
function endRun(outcome) {
  const g = gameById(session.id);
  const st = statsFor(g.id);
  const score = outcome ? Math.round(400 + Math.random() * 9600) : 0;
  const isBest = outcome && score > st.best;

  state.stats[g.id] = { plays: st.plays + 1, best: Math.max(st.best, score) };

  // "Next game" = newest unplayed, excluding this one. It opens that game's
  // DETAIL page rather than launching it (round-2 decision, still holds).
  const next = sorted().find(x => x.id !== g.id && !isPlayed(x));
  const best = state.stats[g.id].best;

  const buttons = `<div class="btns">
      <button class="sheetbtn primary" data-restart="1">${{ a:'Play again', b:'Run it again', c:'Retry', d:'Run it again' }[state.tone]}</button>
      ${next ? `<button class="sheetbtn" data-next="${next.id}">Next game &#9656;</button>` : ''}
      <button class="sheetbtn quiet" data-quit="1">Back to the feed</button>
    </div>`;

  const noScore = `<div class="noscore">This game doesn&rsquo;t report a score.<br>Add <code>Score:</code> to its <code>!gameover</code> to show one.</div>`;
  const bestLine = isBest ? '<span class="new">&#10022; New best</span>' : `Best ${num(best)}`;

  const cards = {
    // A — round 2's card, with the score counting up instead of appearing.
    a: () => `<div class="over">
        <div class="verdict ${outcome ?? ''}">${outcome === 'win' ? 'You win' : 'Game over'}</div>
        <div class="gname">${esc(g.title)}</div>
        ${outcome ? `<div class="scorelbl">Score</div>
          <div class="score" data-count="${score}">0</div>
          <div class="best">${bestLine}</div>` : noScore}
        ${buttons}
      </div>`,

    // B — rubber stamp verdict, odometer score, edition framing.
    b: () => `<div class="over">
        <div class="verdict ${outcome ?? ''}">${outcome === 'win' ? 'Won' : outcome === 'lose' ? 'Lost' : 'Over'}</div>
        <div class="gname">${esc(g.title)} &middot; ${longDate(g.date)}</div>
        ${outcome ? `<div class="scorelbl">Final score</div>
          <div class="score" data-count="${score}">0</div>
          <div class="best">${bestLine}</div>` : noScore}
        ${buttons}
      </div>`,

    // C — full-bleed result screen with a rank letter derived from the score.
    c: () => `<div class="over">
        <div class="verdict ${outcome ?? ''}">${outcome === 'win' ? 'Cleared' : outcome === 'lose' ? 'Wiped out' : 'Game over'}</div>
        <div class="gname">${esc(g.title)}</div>
        ${outcome ? `<div class="rankbig ${outcome === 'lose' ? 'lost' : ''}">${rankFor(score)}</div>
          <div class="scorelbl">Score</div>
          <div class="score" data-count="${score}">0</div>
          <div class="best">${bestLine}</div>` : noScore}
        ${buttons}
      </div>`,

    // D — a result slip: ruled box, stamped verdict, odometer score.
    d: () => `<div class="over">
        <div class="slipkicker">Late result &middot; ${longDate(g.date)}</div>
        <div class="verdict ${outcome ?? ''}">${outcome === 'win' ? 'Won' : outcome === 'lose' ? 'Lost' : 'Over'}</div>
        <div class="gname">${esc(g.title)}</div>
        ${outcome ? `<div class="scorelbl">Final score</div>
          <div class="score" data-count="${score}">0</div>
          <div class="best">${bestLine}</div>` : noScore}
        ${buttons}
      </div>`,
  };

  renderGame(`<div class="overwrap">${cards[state.tone]()}</div>`);
}

// The one piece of motion all three tones share: the score arrives rather than
// appearing. Cheap in uGUI too — it is a coroutine over a Text component.
function countUp() {
  const el = document.querySelector('[data-count]');
  if (!el) return;
  const target = +el.dataset.count, t0 = performance.now(), dur = 620;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = num(Math.round(target * eased));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function closeGame() {
  document.getElementById('overlay')?.remove();
  session = null;
}

    <button data-cycle="1">&#8250;</button>
    <button data-toggletheme="1" class="${state.theme === 'dark' ? 'on' : ''}">${state.theme === 'dark' ? '&#9789; DARK' : '&#9788; LIGHT'}</button>
    <div class="state">${GAMES.filter(isPlayed).length}/${visible().length} played</div>
    <button class="solid" data-reset="1">RESET</button>`;

  // Surface the full state after every action, per the prototype rules.
  console.log('[prototype state]', {
    tone: state.tone, theme: state.theme,
    route: state.route, devMode: state.devMode,
    filter: state.filter, search: state.search,
    stats: JSON.parse(JSON.stringify(state.stats)),
  });
}

// ===========================================================================
// INPUT
// ===========================================================================
const TONE_KEYS = Object.keys(TONES);
function cycleTone(dir) {
  const i = TONE_KEYS.indexOf(state.tone);
  state.tone = TONE_KEYS[(i + dir + TONE_KEYS.length) % TONE_KEYS.length];
  syncUrl(); render();
}
function setTheme(v) { state.theme = v; syncUrl(); render(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-play],[data-detail],[data-go],[data-back],[data-reset],[data-filter],[data-clear],[data-dev],[data-clearcache],[data-resetplayed],[data-pause],[data-resume],[data-restart],[data-quit],[data-next],[data-end],[data-stop],[data-cycle],[data-toggletheme],[data-theme]');
  if (!t) return;
  const d = t.dataset;

  // Scaffolding — tone + theme
  if (d.cycle)        return cycleTone(+d.cycle);
  if (d.toggletheme)  return setTheme(state.theme === 'dark' ? 'light' : 'dark');
  if (d.theme)        return setTheme(d.theme);

  // In-game
  if (d.end)      return endRun(d.end === 'none' ? null : d.end);
  if (d.pause)    { session.paused = true;  return renderGame(); }
  if (d.stop)     return;                                    // taps inside the sheet must not dismiss it
  if (d.resume)   { session.paused = false; return renderGame(); }
  if (d.restart)  { const id = session.id; closeGame(); return launch(id); }
  if (d.quit)     { closeGame(); return go('feed'); }
  if (d.next)     { closeGame(); return go('detail', d.next); }
  if (d.play)     return launch(d.play);

  // Navigation
  if (d.detail)   return go('detail', d.detail);
  if (d.go)       return go(d.go);
  if (d.back)     return go(state.route.from ?? 'feed');

  // Settings
  if (d.dev)          { state.devMode = !state.devMode; return render(); }
  if (d.clearcache)   { return render(); }                   // stub — nothing is cached in a prototype
  if (d.resetplayed)  { state.stats = {}; return render(); }

  // Archive controls
  if (d.filter)   { state.filter = d.filter; return render(); }
  if (d.clear)    { state.search = ''; render(); return document.getElementById('q')?.focus(); }

  if (d.reset)    { seedStats(); return render(); }
});

// Re-render on every keystroke, but restore focus + caret so typing survives it.
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  state.search = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const q = document.getElementById('q');
  if (q) { q.focus(); q.setSelectionRange(caret, caret); }
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft')  return cycleTone(-1);
  if (e.key === 'ArrowRight') return cycleTone(1);
  if (e.key.toLowerCase() === 'd') return setTheme(state.theme === 'dark' ? 'light' : 'dark');
});

syncUrl();
seedStats();
render();
</script>
</body>
</html>

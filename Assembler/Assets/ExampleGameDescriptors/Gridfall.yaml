Game:
  Title: "Gridfall: Tower Defence"
  Description: |
    A systems-dense 3D tower defence built to stress-test the engine's data-driven
    limits. Creeps march a fixed lane toward your power core; you place and upgrade
    towers on the surrounding grid to stop them.

    THE BOARD IS DERIVED, NOT HAND-PAINTED. The lane is authored once as a handful
    of waypoints. On start, an expression WALKS the waypoint segments cell-by-cell
    (for-loops + PositionList) to derive the set of path cells; that one list then
    drives BOTH the visible path tiles (a list-loop trigger spawning a tile per
    cell) and the build-blocking rule (you cannot build on the lane).

    DRAG A TOWER FROM THE PALETTE ONTO A TILE. Each build-menu entry is a
    `ui drag source`: press it and its press/drag/release stream feeds the board.
    uGUI captures the pointer to the widget, so the drag keeps reporting its
    screen position after the finger leaves the button and sweeps over the board -
    a `screen to world` behaviour unprojects that live position through the ACTUAL
    output camera (no authored camera constants, no pinned camera) onto the XZ
    ground plane, and a tiny expression snaps the world point to a cell. The ghost
    plate tracks the drag and colours itself green = buildable, amber = can't
    afford, red = blocked; releasing over a green tile places the tower. Release
    back over the UI rail (a screen-band guard) and nothing is built.

    CLICK A TOWER TO UPGRADE IT. A board tap (`tap trigger` -> the same
    `screen to world` chain) on an occupied cell broadcasts to EVERY tower
    (entity-tag listener); each tower's own condition gate checks "is the picked
    cell my cell, is there gold, am I below max level" so exactly the tapped tower
    levels up - faster fire, longer reach, brighter body.

    ONE TOWER TEMPLATE, FIVE WEAPONS. Towers are a single template parameterised
    by range / fire rate / colour / projectile template id:
      PULSE  - cheap, fast single-target darts
      FROST  - bolts that chill (creeps carry a slow-until timestamp their
               patrol Speed expression reads against the game clock)
      VENOM  - bolts that poison: an on-creep interval trigger ticks damage
               while the game clock is inside the venom-until window
      CANNON - slow shells that detonate into a splash blast on impact
      SNIPER - very slow, very long reach, one heavy slug per shot
    Damage classes are tag-based: creeps carry one detector per projectile tag.

    SIX CREEP KINDS FROM ONE TEMPLATE. The wave table names a kind per wave and
    the factory picks the parameter set: NORMAL, RUNNER (frail, fast), BRUTE
    (tanky, shrugs off frost - its slow-resist parameter feeds the same speed
    expression), SPLITTER (splits into two IMPS on death; the imps re-enter the
    lane at the parent's published patrol index, so they carry on from where it
    fell rather than restarting), and the closing TITAN, whose arrival fires a
    slow-motion pulse and camera shake. Leaked creeps shake the camera and drain
    the core, whose lamp fades green to red with your remaining integrity.

    Desktop: drag from the build menu to place, click a tower to upgrade,
    F fast-forward, Esc quit. Mobile: identical drags/taps with a finger.
    (The interactive UI lives in a right-hand rail whose screen band the board
    picker rejects, so a drag or tap released over the UI never touches the board.)

World:
  Dimensionality: 3
  BackgroundColor: "#070912"

Physics:
  Gravity: !vec { X: 0, Y: 0, Z: 0 }

# Each wave of the assault is one of these records, listed in `wave table`.
Records:
  Wave:
    kind:   { Type: string, Default: "normal" }
    count:  { Type: int,   Default: 0 }
    health: { Type: int,   Default: 1 }
    speed:  { Type: float, Default: 1.0 }
    bounty: { Type: int,   Default: 5 }
    gap:    { Type: float, Default: 1.0 }
    boss:   { Type: bool,  Default: false }

Constants:
  # --- The build grid: 16 x 10 cells of size 1, cell (0,0) centred at the origin ---
  grid cols: 16
  grid rows: 10
  grid origin x: -7.5
  grid origin z: -4.5

  # --- The lane: authored as waypoints; path cells are DERIVED from these on start.
  #     Segments must stay axis-aligned for the cell walk (and for clean visuals). ---
  creep route: !vec [ { X: -9.2, Y: 0.55, Z: 2.5 }, { X: -2.5, Y: 0.55, Z: 2.5 }, { X: -2.5, Y: 0.55, Z: -2.5 }, { X: 2.5, Y: 0.55, Z: -2.5 }, { X: 2.5, Y: 0.55, Z: 1.5 }, { X: 9.0, Y: 0.55, Z: 1.5 } ]
  spawn point: !vec { X: -9.2, Y: 0.55, Z: 2.5 }

  # --- Pointer picking: the `screen to world` behaviour unprojects the pointer
  #     through the live output camera onto the XZ ground plane, so there are no
  #     camera constants to keep in sync and the camera need not be pinned.
  #     `ui guard u` is the only pointer constant left: board interactions must
  #     land in the left `ui guard u` fraction of the screen; the right-hand UI
  #     rail occupies the rest, so a drag/tap released over the palette is ignored
  #     (tune it in-editor to match the rail's on-screen width). ---
  ui guard u: 0.86

  # --- The campaign: kind picks the creep parameter set, the rest are FINAL
  #     stats (no per-kind multipliers hide in the factory). `max wave` must
  #     match the table length. ---
  wave table: !record [
    { Type: Wave, kind: "normal",   count: 6,  health: 4,   speed: 1.2,  bounty: 6,   gap: 1.1 },
    { Type: Wave, kind: "runner",   count: 10, health: 3,   speed: 2.0,  bounty: 5,   gap: 0.8 },
    { Type: Wave, kind: "normal",   count: 12, health: 9,   speed: 1.4,  bounty: 7,   gap: 0.9 },
    { Type: Wave, kind: "brute",    count: 7,  health: 26,  speed: 0.85, bounty: 12,  gap: 1.4 },
    { Type: Wave, kind: "splitter", count: 9,  health: 14,  speed: 1.15, bounty: 8,   gap: 1.0 },
    { Type: Wave, kind: "runner",   count: 18, health: 8,   speed: 2.1,  bounty: 6,   gap: 0.5 },
    { Type: Wave, kind: "brute",    count: 11, health: 34,  speed: 0.95, bounty: 13,  gap: 1.1 },
    { Type: Wave, kind: "splitter", count: 13, health: 20,  speed: 1.3,  bounty: 9,   gap: 0.8 },
    { Type: Wave, kind: "runner",   count: 24, health: 12,  speed: 2.2,  bounty: 7,   gap: 0.45 },
    { Type: Wave, kind: "titan",    count: 1,  health: 520, speed: 0.7,  bounty: 300, gap: 1.0, boss: true } ]
  max wave: 10

  # --- Economy ---
  start gold: 110
  start lives: 10
  wave clear bonus: 30
  upgrade cost: 60
  max tower level: 3

  # --- Tower stats (parameters fed into the one tower template) ---
  pulse cost: 40
  pulse range: 3.2
  pulse fire interval: 0.5
  pulse colour: !colour { R: 0.95, G: 0.8, B: 0.25, A: 1 }
  frost cost: 50
  frost range: 2.8
  frost fire interval: 0.85
  frost colour: !colour { R: 0.35, G: 0.8, B: 1.0, A: 1 }
  venom cost: 55
  venom range: 3.0
  venom fire interval: 0.95
  venom colour: !colour { R: 0.45, G: 0.9, B: 0.3, A: 1 }
  cannon cost: 70
  cannon range: 3.6
  cannon fire interval: 1.6
  cannon colour: !colour { R: 0.95, G: 0.45, B: 0.2, A: 1 }
  sniper cost: 85
  sniper range: 5.6
  sniper fire interval: 2.2
  sniper colour: !colour { R: 0.85, G: 0.9, B: 1.0, A: 1 }
  upgrade interval factor: 0.68
  upgrade range step: 0.9

  # --- Projectiles / damage classes ---
  dart damage: 2
  dart speed: 9.5
  frost damage: 1
  frost bolt speed: 8.0
  frost slow factor: 0.45
  frost slow duration: 1.8
  venom damage: 1
  venom bolt speed: 8.5
  venom duration: 3.0
  venom tick: 0.5
  shell speed: 6.0
  blast damage: 4
  slug damage: 7
  slug speed: 15.0

  # --- Creep kinds (size / tint / frost response per kind; stats come from the table) ---
  creep size: !vec { X: 0.55, Y: 0.62, Z: 0.55 }
  creep colour: !colour { R: 0.9, G: 0.3, B: 0.35, A: 1 }
  runner size: !vec { X: 0.42, Y: 0.5, Z: 0.42 }
  runner colour: !colour { R: 0.98, G: 0.62, B: 0.2, A: 1 }
  brute size: !vec { X: 0.85, Y: 0.85, Z: 0.85 }
  brute colour: !colour { R: 0.6, G: 0.15, B: 0.2, A: 1 }
  brute slow resist: 0.85
  splitter size: !vec { X: 0.6, Y: 0.58, Z: 0.6 }
  splitter colour: !colour { R: 0.2, G: 0.85, B: 0.7, A: 1 }
  imp size: !vec { X: 0.34, Y: 0.4, Z: 0.34 }
  imp colour: !colour { R: 0.45, G: 0.95, B: 0.8, A: 1 }
  titan size: !vec { X: 1.15, Y: 1.35, Z: 1.15 }
  titan colour: !colour { R: 0.7, G: 0.25, B: 0.95, A: 1 }
  titan slow resist: 0.7
  chill tint: !colour { R: 0.5, G: 0.85, B: 1.0, A: 1 }
  venom tint: !colour { R: 0.55, G: 1.0, B: 0.35, A: 1 }
  health full colour: !colour { R: 0.25, G: 0.95, B: 0.4, A: 1 }
  health low colour: !colour { R: 1.0, G: 0.15, B: 0.1, A: 1 }

  # --- Cursor / board look ---
  cursor y: 0.09
  tower y: 0.5
  tile y: 0.035
  cursor ok colour: !colour { R: 0.25, G: 0.95, B: 0.45, A: 1 }
  cursor poor colour: !colour { R: 0.95, G: 0.75, B: 0.2, A: 1 }
  cursor blocked colour: !colour { R: 0.95, G: 0.2, B: 0.15, A: 1 }
  cursor idle colour: !colour { R: 0.35, G: 0.4, B: 0.55, A: 0.6 }
  path colour: !colour { R: 0.3, G: 0.32, B: 0.45, A: 1 }
  ground colour: !colour { R: 0.13, G: 0.15, B: 0.2, A: 1 }
  core colour: !colour { R: 0.3, G: 0.9, B: 0.95, A: 1 }
  portal colour: !colour { R: 0.75, G: 0.3, B: 0.95, A: 1 }

Variables:
  gold: !var start gold
  lives: !var start lives
  kills: 0

  # Wave-loop state (the director rolls wave 0 -> 1 on the first frame).
  wave: 0
  creeps to spawn: 0
  creeps alive: 0
  spawn gap: 1.1

  # Build state. `picked cell` is the raw board cell under the pointer this event
  # (may be off-board); `cursor cell` is the last ON-board cell, where the ghost
  # plate sits. `pointer phase` mirrors the active palette drag ("press"/"drag"/
  # "release"); `placing` is true while that drag is in flight (ghost visible).
  cursor cell: !vec { X: 3, Y: 5 }
  picked cell: !vec { X: -99, Y: -99 }
  selected tower: ""
  placing: false
  pointer phase: ""
  occupied cells: !vec []                  # cells towers already sit on
  path cells: !vec []                      # derived from `creep route` on start

  fast forward: false

Expressions:
  # ---------- Grid plumbing ----------
  cellWorld:
    ArgumentTypes: [ vector, float, float, float ]
    ArgumentNames: [ cell, ox, oz, y ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: 'return new Vector3(ox + cell.x, y, oz + cell.y);'

  # Snap a world point (emitted by the `screen to world` behaviour on the XZ
  # ground plane) to a board (col, row) cell. The camera unprojection now lives
  # in `screen to world`, so this scrap of arithmetic is all that remains of the
  # old hand-rolled, camera-constant picker.
  boardCell:
    ArgumentTypes: [ vector, float, float ]
    ArgumentNames: [ world, ox, oz ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: 'return new Vector3(Round(world.x - ox), Round(world.z - oz), 0f);'

  # Walk each axis-aligned waypoint segment cell-by-cell and collect the unique
  # (col, row) cells the lane covers. Authoring lives in the waypoints; the
  # tiles and the build-block rule both read this derived list.
  pathCells:
    ArgumentTypes: [ vector list, float, float ]
    ArgumentNames: [ wps, ox, oz ]
    ReturnType: vector list
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: |
      var cells = new PositionList();
      int n = wps.Count();
      for (int i = 0; i + 1 < n; i++)
      {
          var a = wps[i];
          var b = wps[i + 1];
          float ac = Round(a.x - ox);
          float ar = Round(a.z - oz);
          float bc = Round(b.x - ox);
          float br = Round(b.z - oz);
          int steps = (int)(Abs(bc - ac) + Abs(br - ar));
          for (int s = 0; s <= steps; s++)
          {
              float t = steps == 0 ? 0f : (float)s / (float)steps;
              float c = Round(Lerp(ac, bc, t));
              float r = Round(Lerp(ar, br, t));
              if (!IsOccupied(cells.ToList(), c, r))
              {
                  cells.Add(new Vector3(c, r, 0f));
              }
          }
      }
      return cells.ToList();

  # The route from waypoint `skip` onward - imps spawned mid-lane resume from
  # their parent's published patrol index instead of restarting at the portal.
  routeFrom:
    ArgumentTypes: [ vector list, int ]
    ArgumentNames: [ wps, skip ]
    ReturnType: vector list
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: |
      var route = new PositionList();
      int n = wps.Count();
      int s = skip < 0 ? 0 : (skip >= n ? n - 1 : skip);
      for (int i = s; i < n; i++)
      {
          route.Add(wps[i]);
      }
      return route.ToList();

  # ---------- Build rules ----------
  canPlace:
    ArgumentTypes: [ vector, vector list, vector list, int, int ]
    ArgumentNames: [ cell, occupied, path, cols, rows ]
    ReturnType: bool
    Expression: 'return InBounds(cell.x, cell.y, cols, rows) && !IsOccupied(occupied, cell.x, cell.y) && !IsOccupied(path, cell.x, cell.y);'

  # True when a screen point lies over the board, not the right-hand UI rail.
  # The only screen-space guard left (the camera math is gone): it stops a drag
  # or tap released back over the palette from acting on the board behind it.
  onBoard:
    ArgumentTypes: [ vector, float ]
    ArgumentNames: [ screen_pos, guard ]
    ReturnType: bool
    RegisterTypes: [ UnityEngine.Screen ]
    Expression: 'return screen_pos.x < UnityEngine.Screen.width * guard;'

  # A palette drag commits a placement only on its "release" event, over the
  # board, on a buildable cell (affordability is checked per-type downstream).
  canDropCommit:
    ArgumentTypes: [ string, vector, float, vector, vector list, vector list, int, int ]
    ArgumentNames: [ phase, screen_pos, guard, cell, occupied, path, cols, rows ]
    ReturnType: bool
    Expression: 'return phase == "release" && onBoard(screen_pos, guard) && canPlace(cell, occupied, path, cols, rows);'

  # A board tap upgrades only when it lands over the board on an occupied cell
  # (the tower on that cell answers the broadcast).
  canUpgradeTap:
    ArgumentTypes: [ vector, float, vector list, vector ]
    ArgumentNames: [ screen_pos, guard, occupied, cell ]
    ReturnType: bool
    Expression: 'return onBoard(screen_pos, guard) && IsOccupied(occupied, cell.x, cell.y);'

  selectedCost:
    ArgumentTypes: [ string, int, int, int, int, int ]
    ArgumentNames: [ sel, pulse, frost, venom, cannon, sniper ]
    ReturnType: int
    Expression: 'return sel == "pulse" ? pulse : (sel == "frost" ? frost : (sel == "venom" ? venom : (sel == "cannon" ? cannon : sniper)));'

  cursorColour:
    ArgumentTypes: [ bool, vector, vector list, vector list, int, int, int, int, colour, colour, colour, colour ]
    ArgumentNames: [ placing, cell, occupied, path, cols, rows, gold, cost, ready, poor, blocked, idle ]
    ReturnType: colour
    Expression: |
      if (!placing)
      {
          return idle;
      }
      if (!canPlace(cell, occupied, path, cols, rows))
      {
          return blocked;
      }
      return gold >= cost ? ready : poor;

  # ---------- Wave-table lookups ----------
  waveInt:
    ArgumentTypes: [ record list, int, string ]
    ArgumentNames: [ table, wave, field ]
    ReturnType: int
    Expression: 'return wave >= 1 && wave <= table.Count() ? GetInt(table[wave - 1], field) : 0;'

  waveFloat:
    ArgumentTypes: [ record list, int, string ]
    ArgumentNames: [ table, wave, field ]
    ReturnType: float
    Expression: 'return wave >= 1 && wave <= table.Count() ? GetFloat(table[wave - 1], field) : 1f;'

  waveBool:
    ArgumentTypes: [ record list, int, string ]
    ArgumentNames: [ table, wave, field ]
    ReturnType: bool
    Expression: 'return wave >= 1 && wave <= table.Count() ? GetBool(table[wave - 1], field) : false;'

  waveKind:
    ArgumentTypes: [ record list, int ]
    ArgumentNames: [ table, wave ]
    ReturnType: string
    Expression: 'return wave >= 1 && wave <= table.Count() ? GetString(table[wave - 1], "kind") : "normal";'

  # Imps inherit a quarter of the wave's health (at least 2).
  impHealth:
    ArgumentTypes: [ record list, int ]
    ArgumentNames: [ table, wave ]
    ReturnType: int
    Expression: |
      int h = waveInt(table, wave, "health") / 4;
      return h < 2 ? 2 : h;

  # ---------- Creeps ----------
  effectiveSpeed:
    ArgumentTypes: [ float, float, float, float ]
    ArgumentNames: [ base, until, t, factor ]
    ReturnType: float
    Expression: 'return t < until ? base * factor : base;'

  # Venom beats chill beats base for the body tint; both at once blends them.
  statusColour:
    ArgumentTypes: [ float, float, float, colour, colour, colour ]
    ArgumentNames: [ t, chill_until, venom_until, base, chill, venom ]
    ReturnType: colour
    Expression: |
      bool chilled = t < chill_until;
      bool poisoned = t < venom_until;
      if (chilled && poisoned)
      {
          return LerpColor(chill, venom, 0.5f);
      }
      if (poisoned)
      {
          return venom;
      }
      return chilled ? chill : base;

  healthGlow:
    ArgumentTypes: [ int, int, colour, colour ]
    ArgumentNames: [ health, max_health, full, hurt ]
    ReturnType: colour
    Expression: 'return LerpColor(hurt, full, max_health > 0 ? (float)health / (float)max_health : 0f);'

  # ---------- Towers ----------
  aimVelocity:
    ArgumentTypes: [ vector, vector, float ]
    ArgumentNames: [ from, to, speed ]
    ReturnType: vector
    Expression: 'return Seek(from, to, speed);'

  muzzle:
    ArgumentTypes: [ vector ]
    ArgumentNames: [ p ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: 'return new Vector3(p.x, p.y + 0.45f, p.z);'

  canUpgrade:
    ArgumentTypes: [ vector, vector, int, int, int, int ]
    ArgumentNames: [ my_cell, picked, gold, cost, level, max ]
    ReturnType: bool
    Expression: 'return Distance(my_cell, picked) < 0.1f && gold >= cost && level < max;'

  towerTint:
    ArgumentTypes: [ colour, int ]
    ArgumentNames: [ base, level ]
    ReturnType: colour
    Expression: 'return Brighten(base, 0.22f * (level - 1));'

  glowIntensity:
    ArgumentTypes: [ int ]
    ArgumentNames: [ level ]
    ReturnType: float
    Expression: 'return 0.9f + 0.7f * (level - 1);'

  # ---------- Misc ----------
  negate:
    ArgumentTypes: [ bool ]
    ArgumentNames: [ flag ]
    ReturnType: bool
    Expression: 'return !flag;'

  pace:
    ArgumentTypes: [ bool ]
    ArgumentNames: [ fast ]
    ReturnType: float
    Expression: 'return fast ? 2f : 1f;'

# Building is a `ui drag source` gesture and upgrading is a `tap trigger`, both of
# which read the pointer directly - so the only Controls actions are the two
# discrete toggles.
Controls:
  Actions:
    speed: { Type: button, Phase: down }
    quit:  { Type: button, Phase: down }

  Bindings:
    desktop:
      speed: [ "<Keyboard>/f" ]
      quit:  [ "<Keyboard>/escape" ]
    mobile:
      speed: [ "<Gamepad>/rightShoulder" ]
      quit:  [ "<Gamepad>/start" ]

Localisation:
  DefaultLocale: en
  Locales:
    en:
      hud.title: "GRIDFALL"
      hud.help1: "Drag a tower from the build menu onto a green tile to place it"
      hud.help2: "Click a placed tower to upgrade it ({0}g)   [F] fast-forward"
      hud.gold: "Gold: {0}"
      hud.lives: "Core integrity: {0}"
      hud.wave: "Wave: {0} / {1}"
      hud.left: "Hostiles: {0}"
      hud.kills: "Kills: {0}"
      hud.boss: "!!  TITAN INBOUND  !!"
      # `hud.placing` is filled with a localised tower name via a nested !text -
      # {0} is itself a !text key (tower.pulse, ...), so translators own both.
      hud.placing: "Placing {0} - release over a green tile"
      hud.idle: "Drag a tower from the build menu to place it"
      tower.pulse: "Pulse"
      tower.frost: "Frost"
      tower.venom: "Venom"
      tower.cannon: "Cannon"
      tower.sniper: "Sniper"
      palette.header: "BUILD"
      btn.pulse: "Pulse - {0}g"
      btn.frost: "Frost - {0}g"
      btn.venom: "Venom - {0}g"
      btn.cannon: "Cannon - {0}g"
      btn.sniper: "Sniper - {0}g"
      btn.speed.normal: "Speed x1"
      btn.speed.fast: "Speed x2"
      btn.quit: "Abandon Run"

Templates:
  # ---------------------------------------------------------------------------
  # THE TOWER. One template covers all five weapons - the spawner parameterises
  # range, fire cadence, colour, projectile template id and projectile speed.
  # perceive tracks the nearest creep in range; `look at` swings the barrel onto
  # it; an interval trigger (its cadence a per-tower variable, so upgrades take
  # effect live) fires whenever a target is held. The upgrade gate answers the
  # tap broadcast only when the picked cell is this tower's cell.
  # ---------------------------------------------------------------------------
  tower_template:
    Tags: [ tower ]
    Variables:
      level: 1
      fire interval: !parameter fire_interval
      range: !parameter range
      my cell: !parameter cell
      has target: false
      target id: ""
      target position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      base:
        Type: primitive
        Properties:
          Shape: cylinder
          Size: !vec { X: 0.72, Y: 0.26, Z: 0.72 }
          Colour: !expr { Do: towerTint, With: { base: !parameter tint, level: !var level } }
      barrel:
        Type: primitive
        Properties:
          Shape: cube
          Size: !vec { X: 0.16, Y: 0.16, Z: 0.95 }
          Colour: !expr { Do: towerTint, With: { base: !parameter tint, level: !var level } }
      lamp:
        Type: light
        Properties:
          Type: point
          Colour: !parameter tint
          Intensity: !expr { Do: glowIntensity, With: { level: !var level } }
          Range: 2.6

      eyes:
        Type: perceive
        Properties:
          Tag: creep
          Radius: !var range
          Interval: 0.1
          TargetId: !var target id
          TargetPosition: !var target position
          HasTarget: !var has target
      aim:
        Type: look at
        Properties:
          Target: !var target position
          TurnRate: 540

      fire clock:
        Type: interval trigger
        Properties:
          Interval: !var fire interval
          AutoStart: true
        Listeners: [ fire gate ]
      fire gate:
        Type: condition gate
        Properties:
          Condition: !var has target
        Listeners: [ launch ]
      launch:
        Type: spawner
        Properties:
          TemplateId: !parameter shot
          Position: !expr { Do: muzzle, With: { p: !entity { Property: Position } } }
          Parameters:
            velocity: !expr
              Do: aimVelocity
              With:
                from: !entity { Property: Position }
                to: !var target position
                speed: !parameter shot_speed

      # Answers the picked-cell broadcast; only the tower on that cell passes.
      upgrade gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: canUpgrade
            With:
              my_cell: !var my cell
              picked: !var picked cell
              gold: !var gold
              cost: !var upgrade cost
              level: !var level
              max: !var max tower level
        Listeners: [ advance level, hasten fire, extend reach, pay upgrade ]
      advance level:
        Type: int variable setter
        Properties:
          VariableId: !var level
          Value: !expr
            Do: 'level + 1'
            ArgumentTypes: [ int ]
            With: { level: !var level }
      hasten fire:
        Type: float variable setter
        Properties:
          VariableId: !var fire interval
          Value: !expr
            Do: 'interval * factor'
            ArgumentTypes: [ float, float ]
            With:
              interval: !var fire interval
              factor: !var upgrade interval factor
      extend reach:
        Type: float variable setter
        Properties:
          VariableId: !var range
          Value: !expr
            Do: 'range + step'
            ArgumentTypes: [ float, float ]
            With:
              range: !var range
              step: !var upgrade range step
      pay upgrade:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold - cost'
            With:
              gold: !var gold
              cost: !var upgrade cost

  # ---------------------------------------------------------------------------
  # THE CREEP. One template covers every kind - the factory parameterises size,
  # tint, frost response and the split flag. It marches the shared route via
  # `patrol` (from waypoint `skip` onward, so split imps resume mid-lane and
  # publish their own progress in turn); its Speed halves while the game clock
  # is inside the frost `slow until` window (scaled by the kind's slow-resist),
  # and venom ticks damage while the clock is inside `venom until`. One damage
  # detector per projectile tag class; both death paths (shot down / reached
  # the core) are guarded by a dead-once flag so the wave counter never
  # double-decrements. Splitters spawn two imps that inherit the parent's
  # patrol index and re-enter the lane where it fell.
  # ---------------------------------------------------------------------------
  creep_template:
    Tags: [ creep ]
    Variables:
      health: !parameter health
      max health: !parameter health
      base speed: !parameter speed
      bounty: !parameter bounty
      slow factor: !parameter slow_resist
      splits: !parameter splits
      slow until: 0.0
      venom until: 0.0
      wp index: 0
      dead: false
    Behaviours:
      body:
        Type: primitive
        Properties:
          Shape: capsule
          Size: !parameter size
          Colour: !expr
            Do: statusColour
            With:
              t: !clock time
              chill_until: !var slow until
              venom_until: !var venom until
              base: !parameter tint
              chill: !var chill tint
              venom: !var venom tint
      glow:
        Type: light
        Properties:
          Type: point
          Colour: !expr
            Do: healthGlow
            With:
              health: !var health
              max_health: !var max health
              full: !var health full colour
              hurt: !var health low colour
          Intensity: 1.3
          Range: 2.2
      collider:
        Type: box collider
        Properties:
          Size: !vec { X: 0.65, Y: 1.0, Z: 0.65 }
          IsTrigger: true
      rb:
        Type: rigidbody
        Properties:
          UseGravity: false
      march:
        Type: patrol
        Properties:
          Waypoints: !expr
            Do: routeFrom
            With:
              wps: !var creep route
              skip: !parameter skip
          Loop: false
          ArriveRadius: 0.2
          CurrentIndex: !var wp index
          Speed: !expr
            Do: effectiveSpeed
            With:
              base: !var base speed
              until: !var slow until
              t: !clock time
              factor: !var slow factor

      # ---- Damage class: pulse darts ----
      dart hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ dart ] }
        Listeners: [ take dart damage, death check ]
      take dart damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With:
              health: !var health
              damage: !var dart damage

      # ---- Damage class: frost bolts (damage + chill window) ----
      frost hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ frost ] }
        Listeners: [ take frost damage, chill, death check ]
      take frost damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With:
              health: !var health
              damage: !var frost damage
      chill:
        Type: float variable setter
        Properties:
          VariableId: !var slow until
          Value: !expr
            Do: 't + duration'
            With:
              t: !clock time
              duration: !var frost slow duration

      # ---- Damage class: venom bolts (damage + a poison window the dot clock reads) ----
      venom hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ venom ] }
        Listeners: [ take venom damage, envenom, death check ]
      take venom damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With:
              health: !var health
              damage: !var venom damage
      envenom:
        Type: float variable setter
        Properties:
          VariableId: !var venom until
          Value: !expr
            Do: 't + duration'
            With:
              t: !clock time
              duration: !var venom duration
      dot clock:
        Type: interval trigger
        Properties: { Interval: !var venom tick, AutoStart: true }
        Listeners: [ dot gate ]
      dot gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 't < until && !dead'
            ArgumentTypes: [ float, float, bool ]
            With:
              t: !clock time
              until: !var venom until
              dead: !var dead
        Listeners: [ venom tick damage, death check ]
      venom tick damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - 1'
            ArgumentTypes: [ int ]
            With: { health: !var health }

      # ---- Damage class: sniper slugs ----
      slug hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ slug ] }
        Listeners: [ take slug damage, death check ]
      take slug damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With:
              health: !var health
              damage: !var slug damage

      # ---- Damage class: cannon splash ----
      blast hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ blast ] }
        Listeners: [ take blast damage, death check ]
      take blast damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With:
              health: !var health
              damage: !var blast damage

      # ---- Death path 1: shot down ----
      death check:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'health <= 0 && !dead'
            ArgumentTypes: [ int, bool ]
            With:
              health: !var health
              dead: !var dead
        Listeners: [ pay bounty, tally kill, mark dead, drop alive, split gate, self destruct ]
      pay bounty:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold + bounty'
            ArgumentTypes: [ int, int ]
            With:
              gold: !var gold
              bounty: !var bounty
      tally kill:
        Type: int variable setter
        Properties:
          VariableId: !var kills
          Value: !expr
            Do: 'kills + 1'
            With: { kills: !var kills }

      # ---- Splitters: two imps rise from the corpse and resume the route.
      #      `drop alive` already ran (-1); the refund (+2) nets the wave +1. ----
      split gate:
        Type: condition gate
        Properties:
          Condition: !var splits
        Listeners: [ spawn imp a, spawn imp b, refund split alive ]
      spawn imp a:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !expr
            Do: 'return new Vector3(p.x - 0.28f, p.y, p.z);'
            ArgumentTypes: [ vector ]
            ReturnType: vector
            RegisterTypes: [ UnityEngine.Vector3 ]
            With: { p: !entity { Property: Position } }
          Parameters:
            health: !expr { Do: impHealth, With: { table: !var wave table, wave: !var wave } }
            speed: !expr
              Do: 'speed * 1.5f'
              ArgumentTypes: [ float ]
              ReturnType: float
              With: { speed: !var base speed }
            bounty: 1
            size: !var imp size
            tint: !var imp colour
            slow_resist: !var frost slow factor
            splits: false
            skip: !var wp index
      spawn imp b:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !expr
            Do: 'return new Vector3(p.x + 0.28f, p.y, p.z);'
            ArgumentTypes: [ vector ]
            ReturnType: vector
            RegisterTypes: [ UnityEngine.Vector3 ]
            With: { p: !entity { Property: Position } }
          Parameters:
            health: !expr { Do: impHealth, With: { table: !var wave table, wave: !var wave } }
            speed: !expr
              Do: 'speed * 1.5f'
              ArgumentTypes: [ float ]
              ReturnType: float
              With: { speed: !var base speed }
            bounty: 1
            size: !var imp size
            tint: !var imp colour
            slow_resist: !var frost slow factor
            splits: false
            skip: !var wp index
      refund split alive:
        Type: int variable setter
        Properties:
          VariableId: !var creeps alive
          Value: !expr
            Do: 'alive + 2'
            With: { alive: !var creeps alive }

      # ---- Death path 2: reached the power core ----
      core breach:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ basecore ] }
        Listeners: [ breach check ]
      breach check:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: negate
            With: { flag: !var dead }
        Listeners:
          - sap life
          - mark dead
          - drop alive
          - { EntityId: fx, BehaviourId: breach shake }
          - self destruct
      sap life:
        Type: int variable setter
        Properties:
          VariableId: !var lives
          Value: !expr
            Do: 'lives - 1'
            With: { lives: !var lives }

      # ---- Shared death effects ----
      mark dead:
        Type: bool variable setter
        Properties: { VariableId: !var dead, Value: true }
      drop alive:
        Type: int variable setter
        Properties:
          VariableId: !var creeps alive
          Value: !expr
            Do: 'alive - 1'
            With: { alive: !var creeps alive }
      self destruct:
        Type: destroy

  # ---------------------------------------------------------------------------
  # PROJECTILES. Straight-shot bodies aimed at the target's position at launch;
  # the creep side owns the damage (one detector per tag class), so a projectile
  # only has to fly, announce its class via Tags, and vanish on contact.
  # ---------------------------------------------------------------------------
  dart_template:
    Tags: [ shot, dart ]
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.18, Y: 0.18, Z: 0.18 }, Colour: !var pulse colour }
      collider:
        Type: sphere collider
        Properties: { Radius: 0.13, IsTrigger: true }
      rb:
        Type: rigidbody
        Properties: { UseGravity: false }
      fly:
        Type: velocity
        Properties: { Velocity: !parameter velocity }
      hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ creep ] }
        Listeners: [ vanish ]
      expire:
        Type: timer trigger
        Properties: { Delay: 1.3, AutoStart: true }
        Listeners: [ vanish ]
      vanish:
        Type: destroy

  frost_template:
    Tags: [ shot, frost ]
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.2, Y: 0.2, Z: 0.2 }, Colour: !var frost colour }
      collider:
        Type: sphere collider
        Properties: { Radius: 0.14, IsTrigger: true }
      rb:
        Type: rigidbody
        Properties: { UseGravity: false }
      fly:
        Type: velocity
        Properties: { Velocity: !parameter velocity }
      hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ creep ] }
        Listeners: [ vanish ]
      expire:
        Type: timer trigger
        Properties: { Delay: 1.5, AutoStart: true }
        Listeners: [ vanish ]
      vanish:
        Type: destroy

  venom_template:
    Tags: [ shot, venom ]
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.2, Y: 0.2, Z: 0.2 }, Colour: !var venom colour }
      collider:
        Type: sphere collider
        Properties: { Radius: 0.14, IsTrigger: true }
      rb:
        Type: rigidbody
        Properties: { UseGravity: false }
      fly:
        Type: velocity
        Properties: { Velocity: !parameter velocity }
      hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ creep ] }
        Listeners: [ vanish ]
      expire:
        Type: timer trigger
        Properties: { Delay: 1.4, AutoStart: true }
        Listeners: [ vanish ]
      vanish:
        Type: destroy

  slug_template:
    Tags: [ shot, slug ]
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.24, Y: 0.24, Z: 0.24 }, Colour: !var sniper colour }
      collider:
        Type: sphere collider
        Properties: { Radius: 0.16, IsTrigger: true }
      rb:
        Type: rigidbody
        Properties: { UseGravity: false }
      fly:
        Type: velocity
        Properties: { Velocity: !parameter velocity }
      hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ creep ] }
        Listeners: [ vanish ]
      expire:
        Type: timer trigger
        Properties: { Delay: 0.9, AutoStart: true }
        Listeners: [ vanish ]
      vanish:
        Type: destroy

  # The shell detonates into a blast entity on impact; the blast does the damage.
  shell_template:
    Tags: [ shot, shell ]
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.3, Y: 0.3, Z: 0.3 }, Colour: !var cannon colour }
      collider:
        Type: sphere collider
        Properties: { Radius: 0.2, IsTrigger: true }
      rb:
        Type: rigidbody
        Properties: { UseGravity: false }
      fly:
        Type: velocity
        Properties: { Velocity: !parameter velocity }
      hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ creep ] }
        Listeners: [ detonate, vanish ]
      detonate:
        Type: spawner
        Properties:
          TemplateId: blast_template
          Position: !entity { Property: Position }
      expire:
        Type: timer trigger
        Properties: { Delay: 2.0, AutoStart: true }
        Listeners: [ vanish ]
      vanish:
        Type: destroy

  # The splash: a short-lived glowing sphere whose trigger volume is the damage
  # area - every creep inside raises its own `blast hit` detector once.
  blast_template:
    Tags: [ blast ]
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 2.3, Y: 2.3, Z: 2.3 }, Colour: !var cannon colour }
      flash:
        Type: light
        Properties: { Type: point, Colour: !var cannon colour, Intensity: 3.5, Range: 4.5 }
      zone:
        Type: sphere collider
        Properties: { Radius: 1.15, IsTrigger: true }
      thump:
        Type: on start trigger
        Listeners:
          - { EntityId: fx, BehaviourId: blast thump }
      fade:
        Type: timer trigger
        Properties: { Delay: 0.3, AutoStart: true }
        Listeners: [ vanish ]
      vanish:
        Type: destroy

  # One visible tile per derived path cell.
  path_tile_template:
    Behaviours:
      slab:
        Type: primitive
        Properties: { Shape: cube, Size: !vec { X: 0.94, Y: 0.05, Z: 0.94 }, Colour: !var path colour }

Entities:
  # =========================================================================
  # LEVEL BUILDER - derives the lane's cell list from the waypoints, then lays
  # a visible tile on every derived cell. Data flows: waypoints -> pathCells
  # expression -> `path cells` list -> tiles + build blocking.
  # =========================================================================
  level builder:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      boot:
        Type: on start trigger
        Listeners: [ derive path cells, lay tiles ]
      derive path cells:
        Type: vector list set
        Properties:
          List: !var path cells
          Value: !expr
            Do: pathCells
            With:
              wps: !var creep route
              ox: !var grid origin x
              oz: !var grid origin z
      lay tiles:
        Type: vector list loop trigger
        Properties: { List: !var path cells }
        Listeners: [ place tile ]
      place tile:
        Type: spawner
        Properties:
          TemplateId: path_tile_template
          Position: !expr
            Do: cellWorld
            With:
              cell: !output item
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var tile y

  # =========================================================================
  # WAVE DIRECTOR - rolls the wave counter whenever the current wave is fully
  # spawned AND fully cleared, refills the spawn budget and cadence from the
  # record table, pays the clear bonus, and choreographs the titan's entrance.
  # =========================================================================
  wave director:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      tick:
        Type: every frame trigger
        Listeners: [ advance gate ]
      advance gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'to_spawn <= 0 && alive <= 0 && wave <= max_wave'
            With:
              to_spawn: !var creeps to spawn
              alive: !var creeps alive
              wave: !var wave
              max_wave: !var max wave
        Listeners: [ next wave, refill budget, set cadence, clear income, titan gate ]
      next wave:
        Type: int variable setter
        Properties:
          VariableId: !var wave
          Value: !expr
            Do: 'wave + 1'
            With: { wave: !var wave }
      refill budget:
        # Reads the already-incremented wave; past the table it stays 0 and the
        # referee declares the win.
        Type: int variable setter
        Properties:
          VariableId: !var creeps to spawn
          Value: !expr
            Do: waveInt
            With: { table: !var wave table, wave: !var wave, field: "count" }
      set cadence:
        Type: float variable setter
        Properties:
          VariableId: !var spawn gap
          Value: !expr
            Do: waveFloat
            With: { table: !var wave table, wave: !var wave, field: "gap" }
      clear income:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'wave > 1 ? gold + bonus : gold'
            With:
              wave: !var wave
              gold: !var gold
              bonus: !var wave clear bonus
      titan gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: waveBool
            With: { table: !var wave table, wave: !var wave, field: "boss" }
        Listeners:
          - { EntityId: fx, BehaviourId: boss slow }
          - { EntityId: fx, BehaviourId: boss restore delay }
          - { EntityId: fx, BehaviourId: boss shake }

  # =========================================================================
  # CREEP FACTORY - drips creeps out of the portal while the wave's budget
  # lasts. The wave table's `kind` field routes each spawn through one of five
  # gated spawners; the table owns the stats, the gate owns the kind's look,
  # frost response and split flag.
  # =========================================================================
  creep factory:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      drip:
        Type: interval trigger
        Properties: { Interval: !var spawn gap, AutoStart: true }
        Listeners: [ spawn gate ]
      spawn gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'to_spawn > 0'
            With: { to_spawn: !var creeps to spawn }
        Listeners: [ normal gate, runner gate, brute gate, splitter gate, titan spawn gate, use budget, count alive ]

      normal gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'waveKind(table, wave) == "normal"'
            ArgumentTypes: [ record list, int ]
            With: { table: !var wave table, wave: !var wave }
        Listeners: [ release normal ]
      release normal:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !var spawn point
          Parameters:
            health: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "health" } }
            speed: !expr { Do: waveFloat, With: { table: !var wave table, wave: !var wave, field: "speed" } }
            bounty: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "bounty" } }
            size: !var creep size
            tint: !var creep colour
            slow_resist: !var frost slow factor
            splits: false
            skip: 0

      runner gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'waveKind(table, wave) == "runner"'
            ArgumentTypes: [ record list, int ]
            With: { table: !var wave table, wave: !var wave }
        Listeners: [ release runner ]
      release runner:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !var spawn point
          Parameters:
            health: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "health" } }
            speed: !expr { Do: waveFloat, With: { table: !var wave table, wave: !var wave, field: "speed" } }
            bounty: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "bounty" } }
            size: !var runner size
            tint: !var runner colour
            slow_resist: !var frost slow factor
            splits: false
            skip: 0

      brute gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'waveKind(table, wave) == "brute"'
            ArgumentTypes: [ record list, int ]
            With: { table: !var wave table, wave: !var wave }
        Listeners: [ release brute ]
      release brute:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !var spawn point
          Parameters:
            health: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "health" } }
            speed: !expr { Do: waveFloat, With: { table: !var wave table, wave: !var wave, field: "speed" } }
            bounty: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "bounty" } }
            size: !var brute size
            tint: !var brute colour
            slow_resist: !var brute slow resist
            splits: false
            skip: 0

      splitter gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'waveKind(table, wave) == "splitter"'
            ArgumentTypes: [ record list, int ]
            With: { table: !var wave table, wave: !var wave }
        Listeners: [ release splitter ]
      release splitter:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !var spawn point
          Parameters:
            health: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "health" } }
            speed: !expr { Do: waveFloat, With: { table: !var wave table, wave: !var wave, field: "speed" } }
            bounty: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "bounty" } }
            size: !var splitter size
            tint: !var splitter colour
            slow_resist: !var frost slow factor
            splits: true
            skip: 0

      titan spawn gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'waveKind(table, wave) == "titan"'
            ArgumentTypes: [ record list, int ]
            With: { table: !var wave table, wave: !var wave }
        Listeners: [ release titan ]
      release titan:
        Type: spawner
        Properties:
          TemplateId: creep_template
          Position: !var spawn point
          Parameters:
            health: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "health" } }
            speed: !expr { Do: waveFloat, With: { table: !var wave table, wave: !var wave, field: "speed" } }
            bounty: !expr { Do: waveInt, With: { table: !var wave table, wave: !var wave, field: "bounty" } }
            size: !var titan size
            tint: !var titan colour
            slow_resist: !var titan slow resist
            splits: false
            skip: 0

      use budget:
        Type: int variable setter
        Properties:
          VariableId: !var creeps to spawn
          Value: !expr
            Do: 'to_spawn - 1'
            With: { to_spawn: !var creeps to spawn }
      count alive:
        Type: int variable setter
        Properties:
          VariableId: !var creeps alive
          Value: !expr
            Do: 'alive + 1'
            With: { alive: !var creeps alive }

  # =========================================================================
  # BUILD CURSOR - the board's pointer end. It owns two pipelines that both
  # start from a `screen to world` unprojection (no camera constants):
  #   PLACEMENT is driven by the palette `ui drag source` widgets. Each forwards
  #     its press/drag/release stream here: `to world` unprojects the live drag
  #     position, `stash raw cell` snaps it to a cell (the ghost plate tracks it),
  #     and on the "release" event `commit gate` places if it landed on a
  #     buildable board tile.
  #   UPGRADE is a `tap trigger` on the board: `tap to world` -> a cell, and if
  #     occupied every tower is pinged so the one on that cell levels up.
  # =========================================================================
  build cursor:
    Position: !vec { X: -4.5, Y: 0.09, Z: 0.5 }
    Behaviours:
      plate:
        Type: primitive
        Properties:
          Shape: cube
          Size: !vec { X: 0.95, Y: 0.12, Z: 0.95 }
          Colour: !expr
            Do: cursorColour
            With:
              placing: !var placing
              cell: !var cursor cell
              occupied: !var occupied cells
              path: !var path cells
              cols: !var grid cols
              rows: !var grid rows
              gold: !var gold
              cost: !expr
                Do: selectedCost
                With:
                  sel: !var selected tower
                  pulse: !var pulse cost
                  frost: !var frost cost
                  venom: !var venom cost
                  cannon: !var cannon cost
                  sniper: !var sniper cost
              ready: !var cursor ok colour
              poor: !var cursor poor colour
              blocked: !var cursor blocked colour
              idle: !var cursor idle colour
      halo:
        Type: light
        Properties:
          Type: point
          Colour: !expr
            Do: cursorColour
            With:
              placing: !var placing
              cell: !var cursor cell
              occupied: !var occupied cells
              path: !var path cells
              cols: !var grid cols
              rows: !var grid rows
              gold: !var gold
              cost: !expr
                Do: selectedCost
                With:
                  sel: !var selected tower
                  pulse: !var pulse cost
                  frost: !var frost cost
                  venom: !var venom cost
                  cannon: !var cannon cost
                  sniper: !var sniper cost
              ready: !var cursor ok colour
              poor: !var cursor poor colour
              blocked: !var cursor blocked colour
              idle: !var cursor idle colour
          Intensity: 1.6
          Range: 2.5
      glide:
        Type: smooth move
        Properties:
          Target: !expr
            Do: cellWorld
            With:
              cell: !var cursor cell
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var cursor y
          SmoothTime: 0.07

      # ---- Shared placement pipeline. The palette `ui drag source` widgets fire
      #      `set placing`, `stash phase` and then `to world` on every press/drag/
      #      release; `to world` unprojects the drag position and drives the ghost
      #      plus the release-only commit. ----
      to world:
        Type: screen to world
        Properties: { ScreenPosition: !output position }
        Listeners: [ stash raw cell, ghost bounds gate, commit gate ]
      stash raw cell:
        Type: vector variable setter
        Properties:
          VariableId: !var picked cell
          Value: !expr
            Do: boardCell
            With:
              world: !output world_position
              ox: !var grid origin x
              oz: !var grid origin z
      ghost bounds gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'InBounds(cell.x, cell.y, cols, rows)'
            ArgumentTypes: [ vector, int, int ]
            With:
              cell: !var picked cell
              cols: !var grid cols
              rows: !var grid rows
        Listeners: [ sync cursor ]
      sync cursor:
        Type: vector variable setter
        Properties:
          VariableId: !var cursor cell
          Value: !var picked cell
      commit gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: canDropCommit
            With:
              phase: !var pointer phase
              screen_pos: !output screen_position
              guard: !var ui guard u
              cell: !var picked cell
              occupied: !var occupied cells
              path: !var path cells
              cols: !var grid cols
              rows: !var grid rows
        Listeners: [ try pulse, try frost, try venom, try cannon, try sniper ]

      # Per-event bookkeeping the drag sources fire before `to world`, so the
      # commit gate reads the right phase and the ghost shows only mid-drag.
      set placing:
        Type: bool variable setter
        Properties:
          VariableId: !var placing
          Value: !expr
            Do: 'phase != "release"'
            ArgumentTypes: [ string ]
            With: { phase: !output phase }
      stash phase:
        Type: string variable setter
        Properties:
          VariableId: !var pointer phase
          Value: !output phase

      # ---- Upgrade: a board tap unprojects to a cell; if it is occupied every
      #      tower is pinged and the one on that cell answers (canUpgrade). The
      #      onBoard guard stops a tap on the palette from reaching the board. ----
      tap:
        Type: tap trigger
        Properties: { MaxDuration: 0.35 }
        Listeners: [ tap to world ]
      tap to world:
        Type: screen to world
        Properties: { ScreenPosition: !output position }
        Listeners: [ stash tap cell, upgrade tap gate ]
      stash tap cell:
        Type: vector variable setter
        Properties:
          VariableId: !var picked cell
          Value: !expr
            Do: boardCell
            With:
              world: !output world_position
              ox: !var grid origin x
              oz: !var grid origin z
      upgrade tap gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: canUpgradeTap
            With:
              screen_pos: !output screen_position
              guard: !var ui guard u
              occupied: !var occupied cells
              cell: !var picked cell
        Listeners:
          - { EntityTag: tower, BehaviourId: upgrade gate }

      # ---- The five typed placements (the palette armed exactly one) ----
      try pulse:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'sel == "pulse" && gold >= cost'
            ArgumentTypes: [ string, int, int ]
            With: { sel: !var selected tower, gold: !var gold, cost: !var pulse cost }
        Listeners: [ place pulse, pay pulse, occupy cell, end placing ]
      place pulse:
        Type: spawner
        Properties:
          TemplateId: tower_template
          Position: !expr
            Do: cellWorld
            With:
              cell: !var picked cell
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var tower y
          Parameters:
            range: !var pulse range
            fire_interval: !var pulse fire interval
            tint: !var pulse colour
            shot: dart_template
            shot_speed: !var dart speed
            cell: !var picked cell
      pay pulse:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold - cost'
            With: { gold: !var gold, cost: !var pulse cost }

      try frost:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'sel == "frost" && gold >= cost'
            ArgumentTypes: [ string, int, int ]
            With: { sel: !var selected tower, gold: !var gold, cost: !var frost cost }
        Listeners: [ place frost, pay frost, occupy cell, end placing ]
      place frost:
        Type: spawner
        Properties:
          TemplateId: tower_template
          Position: !expr
            Do: cellWorld
            With:
              cell: !var picked cell
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var tower y
          Parameters:
            range: !var frost range
            fire_interval: !var frost fire interval
            tint: !var frost colour
            shot: frost_template
            shot_speed: !var frost bolt speed
            cell: !var picked cell
      pay frost:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold - cost'
            With: { gold: !var gold, cost: !var frost cost }

      try venom:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'sel == "venom" && gold >= cost'
            ArgumentTypes: [ string, int, int ]
            With: { sel: !var selected tower, gold: !var gold, cost: !var venom cost }
        Listeners: [ place venom, pay venom, occupy cell, end placing ]
      place venom:
        Type: spawner
        Properties:
          TemplateId: tower_template
          Position: !expr
            Do: cellWorld
            With:
              cell: !var picked cell
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var tower y
          Parameters:
            range: !var venom range
            fire_interval: !var venom fire interval
            tint: !var venom colour
            shot: venom_template
            shot_speed: !var venom bolt speed
            cell: !var picked cell
      pay venom:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold - cost'
            With: { gold: !var gold, cost: !var venom cost }

      try cannon:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'sel == "cannon" && gold >= cost'
            ArgumentTypes: [ string, int, int ]
            With: { sel: !var selected tower, gold: !var gold, cost: !var cannon cost }
        Listeners: [ place cannon, pay cannon, occupy cell, end placing ]
      place cannon:
        Type: spawner
        Properties:
          TemplateId: tower_template
          Position: !expr
            Do: cellWorld
            With:
              cell: !var picked cell
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var tower y
          Parameters:
            range: !var cannon range
            fire_interval: !var cannon fire interval
            tint: !var cannon colour
            shot: shell_template
            shot_speed: !var shell speed
            cell: !var picked cell
      pay cannon:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold - cost'
            With: { gold: !var gold, cost: !var cannon cost }

      try sniper:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'sel == "sniper" && gold >= cost'
            ArgumentTypes: [ string, int, int ]
            With: { sel: !var selected tower, gold: !var gold, cost: !var sniper cost }
        Listeners: [ place sniper, pay sniper, occupy cell, end placing ]
      place sniper:
        Type: spawner
        Properties:
          TemplateId: tower_template
          Position: !expr
            Do: cellWorld
            With:
              cell: !var picked cell
              ox: !var grid origin x
              oz: !var grid origin z
              y: !var tower y
          Parameters:
            range: !var sniper range
            fire_interval: !var sniper fire interval
            tint: !var sniper colour
            shot: slug_template
            shot_speed: !var slug speed
            cell: !var picked cell
      pay sniper:
        Type: int variable setter
        Properties:
          VariableId: !var gold
          Value: !expr
            Do: 'gold - cost'
            With: { gold: !var gold, cost: !var sniper cost }

      # Shared by all five build paths.
      occupy cell:
        Type: vector list add
        Properties:
          List: !var occupied cells
          Value: !var picked cell
      end placing:
        Type: bool variable setter
        Properties: { VariableId: !var placing, Value: false }

      # ---- Arming: each palette `ui drag source` sets `selected tower` to its
      #      own type on every event of its press/drag/release stream, so the
      #      cost ghost and the typed commit gate both read the dragged type. ----
      arm pulse:
        Type: string variable setter
        Properties: { VariableId: !var selected tower, Value: "pulse" }
      arm frost:
        Type: string variable setter
        Properties: { VariableId: !var selected tower, Value: "frost" }
      arm venom:
        Type: string variable setter
        Properties: { VariableId: !var selected tower, Value: "venom" }
      arm cannon:
        Type: string variable setter
        Properties: { VariableId: !var selected tower, Value: "cannon" }
      arm sniper:
        Type: string variable setter
        Properties: { VariableId: !var selected tower, Value: "sniper" }

  # =========================================================================
  # THE POWER CORE - the thing being defended. Its lamp fades green -> red as
  # integrity drains. Creeps detect its tag and burn themselves on arrival.
  # =========================================================================
  power core:
    Tags: [ basecore ]
    Position: !vec { X: 8.6, Y: 0.7, Z: 1.5 }
    Behaviours:
      housing:
        Type: primitive
        Properties: { Shape: cube, Size: !vec { X: 1.1, Y: 1.4, Z: 1.1 }, Colour: !var core colour }
      spin:
        Type: angular velocity
        Properties: { AngularVelocity: !vec { X: 0, Y: 35, Z: 0 } }
      lamp:
        Type: light
        Properties:
          Type: point
          Colour: !expr
            Do: healthGlow
            With:
              health: !var lives
              max_health: !var start lives
              full: !var health full colour
              hurt: !var health low colour
          Intensity: 2.5
          Range: 5
      zone:
        Type: box collider
        Properties: { Size: !vec { X: 1.3, Y: 1.8, Z: 1.3 }, IsTrigger: true }

  # The portal the assault pours out of.
  spawn portal:
    Position: !vec { X: -9.2, Y: 0.7, Z: 2.5 }
    Behaviours:
      frame:
        Type: primitive
        Properties: { Shape: cube, Size: !vec { X: 0.9, Y: 1.5, Z: 0.9 }, Colour: !var portal colour }
      spin:
        Type: angular velocity
        Properties: { AngularVelocity: !vec { X: 0, Y: -60, Z: 0 } }
      glow:
        Type: light
        Properties: { Type: point, Colour: !var portal colour, Intensity: 2.2, Range: 4.5 }

  # Also the camera pivot: `camera follow` tag targets resolve through the live
  # BEHAVIOUR registry, so the tag must sit on an entity that owns at least one
  # behaviour - a bare tagged entity is never registered and the vcam would have
  # no target. The ground slab is centred on the board, so it doubles perfectly.
  ground:
    Tags: [ pivot ]
    Position: !vec { X: 0, Y: -0.05, Z: 0 }
    Behaviours:
      slab:
        Type: primitive
        Properties: { Shape: cube, Size: !vec { X: 20.5, Y: 0.1, Z: 11.4 }, Colour: !var ground colour }

  # =========================================================================
  # FX RACK - camera shakes, the titan's slow-motion entrance, and the shared
  # timescale applier (fast-forward aware, so slow-mo restores to x1 OR x2).
  # =========================================================================
  fx:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      breach shake:
        Type: camera shake
        Properties: { Force: 1.4, Duration: 0.4, Velocity: !vec { X: 0, Y: -1, Z: 0 } }
      blast thump:
        Type: camera shake
        Properties: { Force: 0.25, Duration: 0.12, Velocity: !vec { X: 0, Y: -1, Z: 0 } }
      boss shake:
        Type: camera shake
        Properties: { Force: 2, Duration: 0.7, Velocity: !vec { X: 0, Y: -1, Z: 0 } }
      boss slow:
        Type: set timescale
        Properties: { Scale: 0.35 }
      boss restore delay:
        Type: deferred trigger
        Properties: { Delay: 0.9 }
        Listeners: [ apply pace ]

      # Fast-forward toggle (F key, palette button, mobile shoulder button).
      speed action:
        Type: input action
        Properties: { Action: speed }
        Listeners: [ flip pace, apply pace ]
      flip pace:
        Type: bool variable setter
        Properties:
          VariableId: !var fast forward
          Value: !expr
            Do: negate
            With: { flag: !var fast forward }
      apply pace:
        Type: set timescale
        Properties:
          Scale: !expr
            Do: pace
            With: { fast: !var fast forward }

      quit action:
        Type: input action
        Properties: { Action: quit }
        Listeners:
          - !gameover

  # =========================================================================
  # REFEREE - one poll for both endings: the core falls, or the table is
  # exhausted (the director rolls `wave` past `max wave` only when the final
  # wave is fully spawned and cleared).
  # =========================================================================
  referee:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      tick:
        Type: every frame trigger
        Listeners: [ end gate ]
      end gate:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'lives <= 0 || wave > max_wave'
            With:
              lives: !var lives
              wave: !var wave
              max_wave: !var max wave
        Listeners:
          - !gameover

  # =========================================================================
  # LIGHT & CAMERA - a static overhead-ish rig. `screen to world` reads this
  # camera live for picking, so it no longer needs to be pinned; the modest
  # damping is now purely cosmetic.
  # =========================================================================
  sun:
    Position: !vec { X: 0, Y: 10, Z: 0 }
    Rotation: !vec { X: 60, Y: -35, Z: 0 }
    Behaviours:
      key light:
        Type: light
        Properties: { Type: directional, Colour: !colour { R: 0.75, G: 0.78, B: 0.9, A: 1 }, Intensity: 0.75 }

  camera:
    Position: !vec { X: 0, Y: 12.45, Z: -8 }
    Behaviours:
      camera:
        Type: camera
        Properties: { View: "perspective", DefaultBlend: 0 }

  vcam overview:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      rig:
        Type: camera follow
        Properties:
          Target: { Tag: pivot }
          LookAt: { Tag: pivot }
          Mode: "3d"
          Priority: 10
          Lens: 46
          Damping: 1
          FollowOffset: !vec { X: 0, Y: 12.5, Z: -8 }

  # =========================================================================
  # HUD (read-only labels, upper-left) + BUILD PALETTE (all interactive
  # controls, right-hand rail - its screen band is rejected by the picker so
  # UI clicks can never fall through onto the board).
  # =========================================================================
  ui:
    Position: !vec { X: 0, Y: 0, Z: 0 }
    Behaviours:
      canvas:
        Type: ui canvas
        Properties:
          MatchWidthOrHeight: 0.5
          ReferenceResolution: !vec { X: 1920, Y: 1080 }
    Children:
      hud:
        Behaviours:
          layout:
            Type: ui container
            Properties:
              Direction: vertical
              Spacing: 8
              Padding: 26
              ChildAlignment: upper-left
              FitContent: false
        Children:
          title:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.title
                  FontSize: 42
                  PreferredWidth: 900
                  PreferredHeight: 56
          help1:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.help1
                  FontSize: 20
                  PreferredWidth: 1100
                  PreferredHeight: 30
          help2:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text { Key: hud.help2, Arguments: [ !var upgrade cost ] }
                  FontSize: 20
                  PreferredWidth: 1100
                  PreferredHeight: 30
          gold:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text { Key: hud.gold, Arguments: [ !var gold ] }
                  FontSize: 34
                  PreferredWidth: 520
                  PreferredHeight: 48
          lives:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text { Key: hud.lives, Arguments: [ !var lives ] }
                  FontSize: 30
                  PreferredWidth: 520
                  PreferredHeight: 42
          wave:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text { Key: hud.wave, Arguments: [ !var wave, !var max wave ] }
                  FontSize: 30
                  PreferredWidth: 520
                  PreferredHeight: 42
          left:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text
                    Key: hud.left
                    Arguments:
                      - !expr
                          Do: 'alive + to_spawn'
                          ReturnType: int
                          With:
                            alive: !var creeps alive
                            to_spawn: !var creeps to spawn
                  FontSize: 26
                  PreferredWidth: 520
                  PreferredHeight: 38
          kills:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text { Key: hud.kills, Arguments: [ !var kills ] }
                  FontSize: 26
                  PreferredWidth: 520
                  PreferredHeight: 38
          status:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !expr
                    Do: 'if (!placing) { return idle; } return sel == "pulse" ? msg_pulse : (sel == "frost" ? msg_frost : (sel == "venom" ? msg_venom : (sel == "cannon" ? msg_cannon : msg_sniper)));'
                    ArgumentTypes: [ bool, string, string, string, string, string, string, string ]
                    ReturnType: string
                    With:
                      placing: !var placing
                      sel: !var selected tower
                      idle: !text hud.idle
                      msg_pulse: !text { Key: hud.placing, Arguments: [ !text tower.pulse ] }
                      msg_frost: !text { Key: hud.placing, Arguments: [ !text tower.frost ] }
                      msg_venom: !text { Key: hud.placing, Arguments: [ !text tower.venom ] }
                      msg_cannon: !text { Key: hud.placing, Arguments: [ !text tower.cannon ] }
                      msg_sniper: !text { Key: hud.placing, Arguments: [ !text tower.sniper ] }
                  FontSize: 26
                  PreferredWidth: 700
                  PreferredHeight: 38
          banner:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !expr
                    Do: 'wave == boss_wave ? msg : blank'
                    ArgumentTypes: [ int, int, string, string ]
                    With:
                      wave: !var wave
                      boss_wave: !var max wave
                      msg: !text hud.boss
                      blank: ""
                  FontSize: 38
                  PreferredWidth: 700
                  PreferredHeight: 54
      palette:
        Behaviours:
          layout:
            Type: ui container
            Properties:
              Direction: vertical
              Spacing: 10
              Padding: 20
              ChildAlignment: middle-right
              FitContent: false
        Children:
          header:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text palette.header
                  FontSize: 26
                  PreferredWidth: 240
                  PreferredHeight: 36
          # Each tower entry is a `ui drag source`: press it and drag onto a green
          # board tile to build. The shared listener chain arms this tower's type,
          # mirrors the pointer phase, then hands the drag position to `to world`
          # (which drives the ghost and, on release over a buildable tile, places).
          pulse:
            Behaviours:
              drag:
                Type: ui drag source
                Properties:
                  Label: !text { Key: btn.pulse, Arguments: [ !var pulse cost ] }
                  PreferredWidth: 240
                  PreferredHeight: 54
                Listeners:
                  - { EntityId: build cursor, BehaviourId: arm pulse }
                  - { EntityId: build cursor, BehaviourId: set placing }
                  - { EntityId: build cursor, BehaviourId: stash phase }
                  - { EntityId: build cursor, BehaviourId: to world }
          frost:
            Behaviours:
              drag:
                Type: ui drag source
                Properties:
                  Label: !text { Key: btn.frost, Arguments: [ !var frost cost ] }
                  PreferredWidth: 240
                  PreferredHeight: 54
                Listeners:
                  - { EntityId: build cursor, BehaviourId: arm frost }
                  - { EntityId: build cursor, BehaviourId: set placing }
                  - { EntityId: build cursor, BehaviourId: stash phase }
                  - { EntityId: build cursor, BehaviourId: to world }
          venom:
            Behaviours:
              drag:
                Type: ui drag source
                Properties:
                  Label: !text { Key: btn.venom, Arguments: [ !var venom cost ] }
                  PreferredWidth: 240
                  PreferredHeight: 54
                Listeners:
                  - { EntityId: build cursor, BehaviourId: arm venom }
                  - { EntityId: build cursor, BehaviourId: set placing }
                  - { EntityId: build cursor, BehaviourId: stash phase }
                  - { EntityId: build cursor, BehaviourId: to world }
          cannon:
            Behaviours:
              drag:
                Type: ui drag source
                Properties:
                  Label: !text { Key: btn.cannon, Arguments: [ !var cannon cost ] }
                  PreferredWidth: 240
                  PreferredHeight: 54
                Listeners:
                  - { EntityId: build cursor, BehaviourId: arm cannon }
                  - { EntityId: build cursor, BehaviourId: set placing }
                  - { EntityId: build cursor, BehaviourId: stash phase }
                  - { EntityId: build cursor, BehaviourId: to world }
          sniper:
            Behaviours:
              drag:
                Type: ui drag source
                Properties:
                  Label: !text { Key: btn.sniper, Arguments: [ !var sniper cost ] }
                  PreferredWidth: 240
                  PreferredHeight: 54
                Listeners:
                  - { EntityId: build cursor, BehaviourId: arm sniper }
                  - { EntityId: build cursor, BehaviourId: set placing }
                  - { EntityId: build cursor, BehaviourId: stash phase }
                  - { EntityId: build cursor, BehaviourId: to world }
          speed:
            Behaviours:
              button:
                Type: ui button
                Properties:
                  Label: !expr
                    Do: 'fast ? fast_label : normal_label'
                    ArgumentTypes: [ bool, string, string ]
                    With:
                      fast: !var fast forward
                      fast_label: !text btn.speed.fast
                      normal_label: !text btn.speed.normal
                  PreferredWidth: 240
                  PreferredHeight: 48
                Listeners:
                  - { EntityId: fx, BehaviourId: flip pace }
                  - { EntityId: fx, BehaviourId: apply pace }
          quit:
            Behaviours:
              button:
                Type: ui button
                Properties:
                  Label: !text btn.quit
                  PreferredWidth: 240
                  PreferredHeight: 48
                Listeners:
                  - !gameover

Game:
  Title: Primitive Models — the ten `model` recipes
  Description: >
    Every worked recipe from `Assets/docs/Models.md`, laid out on a 5x2 grid so they can be
    compared side by side, plus a shape sampler that shows what `model`'s normalised `Size`
    actually produces for each of the six primitives. Each entity's `Parts:` list is copied
    verbatim from the doc — this file is the proof that the doc's YAML parses and that the
    numbers in it land where they claim to. Static camera; inspect closely via the Scene view
    while in Play mode. Escape quits.

World:
  Dimensionality: 3
  BackgroundColor: "#182028"

# Three directional lights. Directional coverage is position-independent, so every model on the
# grid is lit identically and the recipes can be compared fairly — a point/spot rig would flatter
# whichever prop happened to sit under it.
Controls:
  Actions:
    quit: { Type: button, Phase: down }

  Bindings:
    desktop:
      quit: [ "<Keyboard>/escape" ]
    mobile:
      quit: [ "<Gamepad>/buttonSouth" ]

Localisation:
  DefaultLocale: en
  Locales:
    en:
      hud.title: "model recipes — 1 unit = 1 m, +Z forward, every part grounded at Y 0"
      hud.row.back: "back row (Z -5), left to right:  tree · house · car · turret · humanoid"
      hud.row.front: "front row (Z +5), left to right:  crate · barrel · coin · rock · streetlight"
      hud.row.sampler: "far row (Z +14):  shape sampler — cube · cylinder · capsule x2 · sphere · plane · quad"
      hud.quit: "Esc to quit"

Entities:
  # ---- Stage: ground and lights -------------------------------------------
  ground:
    # Deliberately a `primitive` cube, not a plane: for a cube `Size` means the same thing in both
    # behaviours (it is already unit-sized), so the ground cannot accidentally teach the divergence.
    # Half the 0.2 thickness sits below the origin, putting the top face at exactly Y 0.
    Position: !vec { X: 0, Y: -0.1, Z: 0 }
    Behaviours:
      slab:
        Type: primitive
        Properties:
          Shape: cube
          Colour: !colour "#4d5359"
          Size: !vec { X: 60, Y: 0.2, Z: 60 }

  key light:
    Rotation: !vec { X: 50, Y: -30, Z: 0 }
    Behaviours:
      light:
        Type: light
        Properties:
          Type: directional
          Colour: !colour "#fff4e0"
          Intensity: 1.1

  fill light:
    Rotation: !vec { X: -15, Y: 145, Z: 0 }
    Behaviours:
      light:
        Type: light
        Properties:
          Type: directional
          Colour: !colour "#8fa8d0"
          Intensity: 0.35

  rim light:
    Rotation: !vec { X: 25, Y: 200, Z: 0 }
    Behaviours:
      light:
        Type: light
        Properties:
          Type: directional
          Colour: !colour "#cfe4ff"
          Intensity: 0.35

  camera:
    Tags: [ camera ]
    # No virtual camera anywhere in this file, so the Cinemachine brain leaves the transform alone
    # and the camera keeps this authored Position/Rotation. `camera` has no LookAt — aim it by Rotation.
    Position: !vec { X: 0, Y: 12, Z: -22 }
    Rotation: !vec { X: 21, Y: 0, Z: 0 }
    Behaviours:
      camera:
        Type: camera
        Properties:
          View: "perspective"
          DefaultBlend: 0

  quit:
    # The only input in the file, and the only reason it exists: a descriptor with no reachable
    # !gameover listener is refused at build time.
    Behaviours:
      quit action:
        Type: input action
        Properties:
          Action: quit
        Listeners:
          - !gameover

  # ---- Back row (Z -5) ----------------------------------------------------
  # Every prop below carries `Rotation: Y 180`. The recipes are authored +Z forward — doors,
  # headlights, gun barrels and visors all face +Z — and this camera sits on the -Z side looking
  # toward +Z, so without it every prop would present its back. Turning the *entity* rather than
  # editing the parts is the whole point of the split: the `model` describes the prop, the entity
  # places and aims it. The shape sampler is deliberately left unturned — see its own note.
  tree:
    # 3 parts, 3 rendered · 2.40 x 4.60 x 2.40 m.
    # The cylinder-halving bite and the overlap rule. Size.Y 2.2 on the trunk becomes localScale.Y 1.1
    # and the trunk is genuinely 2.2 m tall; its top at 2.2 is buried 0.5 inside the lower canopy, and
    # the two canopies overlap by 0.6. Nothing here merely touches.
    Position: !vec { X: -16, Y: 0, Z: -5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#3f7d3a"
          Parts:
            - Name: trunk
              Shape: cylinder
              Size: !vec { X: 0.32, Y: 2.2, Z: 0.32 }
              Anchor: bottom
              Colour: !colour "#6b4423"
            - Name: canopy lower
              Shape: sphere
              Size: !vec { X: 2.4, Y: 2, Z: 2.4 }
              Position: !vec { X: 0, Y: 1.7, Z: 0 }
              Anchor: bottom
            - Name: canopy upper
              Shape: sphere
              Size: !vec { X: 1.7, Y: 1.5, Z: 1.7 }
              Position: !vec { X: 0, Y: 3.1, Z: 0 }
              Anchor: bottom
              Colour: !colour "#56a34a"

  house:
    # 7 parts, 12 rendered · 4.72 x 3.68 x 3.40 m.
    # Anchor-as-hinge and the one legitimate mirrored part at X 0. Pitch 31 deg = atan(1.2 / 2.0). The
    # roof is anchored `right`, so its ridge end lands on (0, 3.6, 0) and the slab swings about that
    # point; the eave ends up at (-2.314, 2.209) — a 0.31 overhang below the 2.4 wall top. `Mirror: x`
    # leaves Position.X at 0 but flips the anchor to `left` and Rotation.Z to -31, so the twin sweeps
    # the other way. The gable end is the stepped approximation: one rectangle covers at most half a
    # triangle, so three boards of decreasing width stack up the slope and close about 85 % of it. Each
    # board's width is set by where the roof's underside sits at that height — underside y = 3.551 - 0.601x.
    Position: !vec { X: -8, Y: 0, Z: -5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#d9cdb8"
          Parts:
            - Name: walls
              Shape: cube
              Size: !vec { X: 4, Y: 2.4, Z: 3 }
              Anchor: bottom
            - Name: roof
              Shape: cube
              Size: !vec { X: 2.7, Y: 0.18, Z: 3.4 }
              Position: !vec { X: 0, Y: 3.6, Z: 0 }
              Rotation: !vec { X: 0, Y: 0, Z: 31 }
              Anchor: right
              Mirror: x
              Colour: !colour "#8c3b2e"
            - Name: gable lower
              Shape: cube
              Size: !vec { X: 2.8, Y: 0.38, Z: 0.16 }
              Position: !vec { X: 0, Y: 2.3, Z: 1.5 }
              Anchor: bottom-front
              Mirror: z
            - Name: gable middle
              Shape: cube
              Size: !vec { X: 1.5, Y: 0.42, Z: 0.16 }
              Position: !vec { X: 0, Y: 2.66, Z: 1.5 }
              Anchor: bottom-front
              Mirror: z
            - Name: gable upper
              Shape: cube
              Size: !vec { X: 0.8, Y: 0.24, Z: 0.16 }
              Position: !vec { X: 0, Y: 3.06, Z: 1.5 }
              Anchor: bottom-front
              Mirror: z
            - Name: door
              Shape: cube
              Size: !vec { X: 0.85, Y: 1.75, Z: 0.1 }
              Position: !vec { X: 0, Y: 0, Z: 1.47 }
              Anchor: bottom-back
              Colour: !colour "#4a3423"
            - Name: window
              Shape: cube
              Size: !vec { X: 0.7, Y: 0.6, Z: 0.1 }
              Position: !vec { X: 1.25, Y: 1.35, Z: 1.47 }
              Anchor: back
              Mirror: x
              Colour: !colour "#6fa8c9"

  car:
    # 6 parts, 11 rendered · 2.04 x 1.55 x 4.20 m.
    # `Mirror: xz` and the oversized slab. The wheel is the xz showcase: Size.Y 0.24 becomes
    # localScale.Y 0.12, `Rotation: Z 90` lays the cylinder axis along world X, and centre Y 0.33 makes
    # the tyre touch Y 0 exactly. Both mirrored axes carry a non-zero Position, so no twin is
    # coincident. The glass band is 0.03 wider and 0.04 deeper than the cabin it passes through, so one
    # part reads as glazing on all four sides instead of four separate panes.
    Position: !vec { X: 0, Y: 0, Z: -5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#c8443c"
          Parts:
            - Name: chassis
              Shape: cube
              Size: !vec { X: 1.8, Y: 0.7, Z: 4 }
              Position: !vec { X: 0, Y: 0.35, Z: 0 }
              Anchor: bottom
            - Name: cabin
              Shape: cube
              Size: !vec { X: 1.55, Y: 0.6, Z: 2 }
              Position: !vec { X: 0, Y: 0.95, Z: -0.15 }
              Anchor: bottom
            - Name: glass band
              Shape: cube
              Size: !vec { X: 1.58, Y: 0.3, Z: 2.04 }
              Position: !vec { X: 0, Y: 1.08, Z: -0.15 }
              Anchor: bottom
              Colour: !colour "#2c3e50"
            - Name: wheel
              Shape: cylinder
              Size: !vec { X: 0.66, Y: 0.24, Z: 0.66 }
              Position: !vec { X: 0.9, Y: 0.33, Z: 1.25 }
              Rotation: !vec { X: 0, Y: 0, Z: 90 }
              Mirror: xz
              Colour: !colour "#1a1a1a"
            - Name: headlight
              Shape: sphere
              Size: !vec { X: 0.22, Y: 0.18, Z: 0.14 }
              Position: !vec { X: 0.58, Y: 0.75, Z: 2 }
              Mirror: x
              Colour: !colour "#ffe9a8"
            - Name: bumper
              Shape: cube
              Size: !vec { X: 1.86, Y: 0.18, Z: 0.16 }
              Position: !vec { X: 0, Y: 0.45, Z: 1.94 }
              Anchor: back
              Mirror: z
              Colour: !colour "#1a1a1a"

  turret:
    # 6 parts, 8 rendered · 1.50 x 1.52 x 2.05 m.
    # `Rotation: X 90` + `Anchor: bottom` makes a cylinder grow *forward* from its Position: the barrel
    # starts at Z 0 inside the housing and ends at Z 1.2, and lengthening it is a one-number edit to
    # Size.Y with Position untouched. The eye sphere's centre sits on the dome's surface, so half of it
    # protrudes — cheaper and more robust than solving for tangency.
    Position: !vec { X: 8, Y: 0, Z: -5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#5a6470"
          Parts:
            - Name: base
              Shape: cylinder
              Size: !vec { X: 1.5, Y: 0.3, Z: 1.5 }
              Anchor: bottom
            - Name: housing
              Shape: cube
              Size: !vec { X: 1, Y: 0.7, Z: 1.1 }
              Position: !vec { X: 0, Y: 0.24, Z: 0 }
              Anchor: bottom
            - Name: dome
              Shape: sphere
              Size: !vec { X: 0.9, Y: 0.7, Z: 0.9 }
              Position: !vec { X: 0, Y: 0.82, Z: 0 }
              Anchor: bottom
              Colour: !colour "#79838f"
            - Name: eye
              Shape: sphere
              Size: !vec { X: 0.34, Y: 0.34, Z: 0.34 }
              Position: !vec { X: 0, Y: 1.17, Z: 0.36 }
              Colour: !colour "#e8483c"
            - Name: barrel
              Shape: cylinder
              Size: !vec { X: 0.18, Y: 1.2, Z: 0.18 }
              Position: !vec { X: 0.28, Y: 0.72, Z: 0 }
              Rotation: !vec { X: 90, Y: 0, Z: 0 }
              Anchor: bottom
              Mirror: x
              Colour: !colour "#3a4048"
            - Name: muzzle
              Shape: cylinder
              Size: !vec { X: 0.28, Y: 0.22, Z: 0.28 }
              Position: !vec { X: 0.28, Y: 0.72, Z: 1.08 }
              Rotation: !vec { X: 90, Y: 0, Z: 0 }
              Anchor: bottom
              Mirror: x
              Colour: !colour "#3a4048"

  humanoid:
    # 8 parts, 11 rendered · 0.90 x 1.82 x 0.37 m.
    # Capsule caps and splayed limbs. Every mass overlaps its neighbour: feet into legs, legs into hips,
    # hips into torso, torso into neck, neck into head. The arms are anchored `top` at the shoulder and
    # rotated 6 deg outward so they clear the torso; `Mirror: x` negates Rotation.Z to -6 and the splay
    # mirrors correctly. The legs are Size.Y 0.85 against Size.X 0.20 where true hemisphere caps would
    # need Y = 0.40, so the caps are stretched about 2.1x — stylistically fine here, and a one-word swap
    # to `cylinder` at identical Size if it is not.
    Position: !vec { X: 16, Y: 0, Z: -5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#4f6d8f"
          Parts:
            - Name: foot
              Shape: cube
              Size: !vec { X: 0.2, Y: 0.09, Z: 0.34 }
              Position: !vec { X: 0.15, Y: 0, Z: 0.05 }
              Anchor: bottom
              Mirror: x
              Colour: !colour "#2c3542"
            - Name: leg
              Shape: capsule
              Size: !vec { X: 0.2, Y: 0.85, Z: 0.2 }
              Position: !vec { X: 0.15, Y: 0.04, Z: 0 }
              Anchor: bottom
              Mirror: x
            - Name: hips
              Shape: cube
              Size: !vec { X: 0.44, Y: 0.16, Z: 0.26 }
              Position: !vec { X: 0, Y: 0.88, Z: 0 }
              Colour: !colour "#2c3542"
            - Name: torso
              Shape: cube
              Size: !vec { X: 0.52, Y: 0.56, Z: 0.28 }
              Position: !vec { X: 0, Y: 0.9, Z: 0 }
              Anchor: bottom
            - Name: arm
              Shape: capsule
              Size: !vec { X: 0.17, Y: 0.62, Z: 0.17 }
              Position: !vec { X: 0.3, Y: 1.42, Z: 0 }
              Rotation: !vec { X: 0, Y: 0, Z: 6 }
              Anchor: top
              Mirror: x
            - Name: neck
              Shape: cylinder
              Size: !vec { X: 0.13, Y: 0.1, Z: 0.13 }
              Position: !vec { X: 0, Y: 1.4, Z: 0 }
              Anchor: bottom
              Colour: !colour "#2c3542"
            - Name: head
              Shape: sphere
              Size: !vec { X: 0.32, Y: 0.36, Z: 0.3 }
              Position: !vec { X: 0, Y: 1.46, Z: 0 }
              Anchor: bottom
              Colour: !colour "#c9d2dc"
            - Name: visor
              Shape: cube
              Size: !vec { X: 0.22, Y: 0.055, Z: 0.04 }
              Position: !vec { X: 0, Y: 1.68, Z: 0.145 }
              Colour: !colour "#7fe3ff"

  # ---- Front row (Z +5) ---------------------------------------------------

  crate:
    # 3 parts, 6 rendered · 1.06 x 1.05 x 1.06 m.
    # The cleanest `Mirror: xz`: one authored corner post becomes four. The posts stand 0.02 proud of
    # the body's +/-0.50 faces so they read as battens rather than decals, and they are inset 0.02 top
    # and bottom so no face is coplanar with the body's — two coplanar co-facing faces z-fight.
    Position: !vec { X: -16, Y: 0, Z: 5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#a9793f"
          Parts:
            - Name: body
              Shape: cube
              Size: !vec { X: 1, Y: 1, Z: 1 }
              Anchor: bottom
            - Name: corner post
              Shape: cube
              Size: !vec { X: 0.14, Y: 0.96, Z: 0.14 }
              Position: !vec { X: 0.45, Y: 0.02, Z: 0.45 }
              Anchor: bottom
              Mirror: xz
              Colour: !colour "#7a5427"
            - Name: lid rim
              Shape: cube
              Size: !vec { X: 1.06, Y: 0.1, Z: 1.06 }
              Position: !vec { X: 0, Y: 0.95, Z: 0 }
              Anchor: bottom
              Colour: !colour "#7a5427"

  barrel:
    # 4 parts, 4 rendered · 0.84 x 1.08 x 0.84 m.
    # There is no Y mirror, so the two hoops are the same part typed twice — that is the recipe. The
    # cylinder halving bites four times over (localScale.Y 0.525 / 0.045 / 0.045 / 0.04). The hoops are
    # 0.03 wider in radius than the staves: the oversized slab, applied radially.
    Position: !vec { X: -8, Y: 0, Z: 5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#7a5a34"
          Parts:
            - Name: staves
              Shape: cylinder
              Size: !vec { X: 0.78, Y: 1.05, Z: 0.78 }
              Anchor: bottom
            - Name: lower hoop
              Shape: cylinder
              Size: !vec { X: 0.84, Y: 0.09, Z: 0.84 }
              Position: !vec { X: 0, Y: 0.22, Z: 0 }
              Anchor: bottom
              Colour: !colour "#4a4a52"
            - Name: upper hoop
              Shape: cylinder
              Size: !vec { X: 0.84, Y: 0.09, Z: 0.84 }
              Position: !vec { X: 0, Y: 0.74, Z: 0 }
              Anchor: bottom
              Colour: !colour "#4a4a52"
            - Name: lid
              Shape: cylinder
              Size: !vec { X: 0.72, Y: 0.08, Z: 0.72 }
              Position: !vec { X: 0, Y: 1, Z: 0 }
              Anchor: bottom
              Colour: !colour "#8a6a40"

  coin:
    # 3 parts, 3 rendered · 0.62 x 0.62 x 0.10 m, floating between Y 0.14 and Y 0.76.
    # The deliberate exception to "ground everything" — a pickup should hover. `Rotation: X 90` swings
    # the cylinder axis onto world Z, standing the disc upright in the XY plane. The rim is wider but
    # thinner than the face, so only a 0.035 ring of it shows: the oversized slab again, radially.
    Position: !vec { X: 0, Y: 0, Z: 5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#d4a017"
          Parts:
            - Name: rim
              Shape: cylinder
              Size: !vec { X: 0.62, Y: 0.06, Z: 0.62 }
              Position: !vec { X: 0, Y: 0.45, Z: 0 }
              Rotation: !vec { X: 90, Y: 0, Z: 0 }
            - Name: face
              Shape: cylinder
              Size: !vec { X: 0.55, Y: 0.08, Z: 0.55 }
              Position: !vec { X: 0, Y: 0.45, Z: 0 }
              Rotation: !vec { X: 90, Y: 0, Z: 0 }
              Colour: !colour "#f0c33c"
            - Name: emblem
              Shape: cube
              Size: !vec { X: 0.22, Y: 0.22, Z: 0.1 }
              Position: !vec { X: 0, Y: 0.45, Z: 0 }
              Rotation: !vec { X: 0, Y: 0, Z: 45 }
              Colour: !colour "#a87708"

  rock:
    # 3 parts, 3 rendered · 2.37 x 1.20 x 2.07 m, of which 0.28 is below Y 0.
    # The other exception to `Anchor: bottom`: these are centre-pivoted and deliberately sunk, because
    # burying the lower quarter is what stops a rock reading as a ball resting on a floor. Second
    # lesson: rotating a sphere is a no-op unless it is non-uniformly scaled — these are ellipsoids, so
    # Rotation.Y genuinely reorients them. This recipe depends on there being ground at Y 0; copied into
    # a floating-platform game, a quarter of it hangs in mid-air.
    Position: !vec { X: 8, Y: 0, Z: 5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#6e6f74"
          Parts:
            - Name: main
              Shape: sphere
              Size: !vec { X: 1.7, Y: 1.2, Z: 1.5 }
              Position: !vec { X: 0, Y: 0.32, Z: 0 }
              Rotation: !vec { X: 0, Y: 20, Z: 0 }
            - Name: shoulder
              Shape: sphere
              Size: !vec { X: 1.05, Y: 0.9, Z: 1.15 }
              Position: !vec { X: 0.55, Y: 0.2, Z: -0.3 }
              Rotation: !vec { X: 0, Y: -35, Z: 0 }
              Colour: !colour "#7c7d83"
            - Name: chip
              Shape: sphere
              Size: !vec { X: 0.75, Y: 0.62, Z: 0.8 }
              Position: !vec { X: -0.5, Y: 0.22, Z: 0.35 }
              Rotation: !vec { X: 0, Y: 50, Z: 0 }
              Colour: !colour "#62636a"

  streetlight:
    # 5 parts, 5 rendered · 1.84 x 4.69 x 0.36 m.
    # The anchor-as-hinge showcase, and the only honest way to place the head. The arm is anchored
    # `bottom` at (0, 4.1, 0) and rotated Z -70, so it pivots at its foot; its tip therefore lands at
    # x = 1.5 * sin(70) = 1.410 and y = 4.10 + 1.5 * cos(70) = 4.613 — which is exactly where the head
    # is the head's
    # Position — with no anchor at all, because centring the head on the tip is what buries the arm's flat
    # end cap inside it instead of letting it poke through the head's top face. Change the arm's length or
    # angle and the head has to be re-derived; that is the cost of the technique, and still far cheaper
    # than hand-computing a rotated centre.
    Position: !vec { X: 16, Y: 0, Z: 5 }
    Rotation: !vec { X: 0, Y: 180, Z: 0 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#3c4046"
          Parts:
            - Name: base
              Shape: cylinder
              Size: !vec { X: 0.36, Y: 0.16, Z: 0.36 }
              Anchor: bottom
            - Name: column
              Shape: cylinder
              Size: !vec { X: 0.16, Y: 4.2, Z: 0.16 }
              Position: !vec { X: 0, Y: 0.1, Z: 0 }
              Anchor: bottom
            - Name: arm
              Shape: cylinder
              Size: !vec { X: 0.13, Y: 1.5, Z: 0.13 }
              Position: !vec { X: 0, Y: 4.1, Z: 0 }
              Rotation: !vec { X: 0, Y: 0, Z: -70 }
              Anchor: bottom
            - Name: head
              Shape: cube
              Size: !vec { X: 0.5, Y: 0.16, Z: 0.3 }
              Position: !vec { X: 1.41, Y: 4.61, Z: 0 }
            - Name: lens
              Shape: cube
              Size: !vec { X: 0.42, Y: 0.06, Z: 0.24 }
              Position: !vec { X: 1.41, Y: 4.55, Z: 0 }
              Anchor: top
              Colour: !colour "#ffe9b0"
    Children:
      lamp:
        # The lens is matte — `model` has no emissive channel and no light of its own. Anything that
        # should *glow* needs a real `light`, so the lamp is a child entity parked just under the head.
        Position: !vec { X: 1.41, Y: 4.42, Z: 0 }
        Behaviours:
          light:
            Type: light
            Properties:
              Type: point
              Colour: !colour "#ffd9a0"
              Intensity: 4
              Range: 12

  # ---- Far row (Z +14): the shape sampler ---------------------------------

  shape sampler:
    # What `model`'s normalised Size actually produces, one part per primitive. The cube and the
    # cylinder are both Size 1,3,1 and are both genuinely 3 m tall — under `primitive` the cylinder
    # would be 6. The two capsules are Size 1,2,1 and 1,3,1: the first has Y = 2X and therefore true
    # hemisphere caps, the second is the same width and visibly stretched. The plane is Size 2,1,2 and
    # is genuinely 2 x 2 (Unity's plane is natively 10 x 10); its Size.Y does nothing, because a plane
    # has no thickness, and it faces +Y so it is only visible from above. The quad is 1 x 1 in the XY
    # plane, its Size.Z does nothing, and its normal points along -Z — so it is visible from the -Z side,
    # which is where this camera is. This is the one entity here with no `Rotation: Y 180`: turned to face
    # +Z like the props, the quad would simply vanish, because URP's Lit shader is single-sided.
    Position: !vec { X: 0, Y: 0, Z: 14 }
    Behaviours:
      body:
        Type: model
        Properties:
          Colour: !colour "#b9c2cc"
          Parts:
            - Name: cube 1x3x1
              Shape: cube
              Size: !vec { X: 1, Y: 3, Z: 1 }
              Position: !vec { X: -4.5, Y: 0, Z: 0 }
              Anchor: bottom
            - Name: cylinder 1x3x1
              Shape: cylinder
              Size: !vec { X: 1, Y: 3, Z: 1 }
              Position: !vec { X: -3, Y: 0, Z: 0 }
              Anchor: bottom
            - Name: capsule 1x2x1
              Shape: capsule
              Size: !vec { X: 1, Y: 2, Z: 1 }
              Position: !vec { X: -1.5, Y: 0, Z: 0 }
              Anchor: bottom
            - Name: capsule 1x3x1
              Shape: capsule
              Size: !vec { X: 1, Y: 3, Z: 1 }
              Anchor: bottom
              Colour: !colour "#cdb98a"
            - Name: sphere 1x1x1
              Shape: sphere
              Size: !vec { X: 1, Y: 1, Z: 1 }
              Position: !vec { X: 1.5, Y: 0, Z: 0 }
              Anchor: bottom
            - Name: plane 2x2
              Shape: plane
              Size: !vec { X: 2, Y: 1, Z: 2 }
              Position: !vec { X: 3.2, Y: 0.02, Z: 0 }
              Colour: !colour "#7fb2d4"
            - Name: quad 1x1
              Shape: quad
              Size: !vec { X: 1, Y: 1, Z: 1 }
              Position: !vec { X: 5, Y: 0, Z: 0 }
              Anchor: bottom
              Colour: !colour "#d48f7f"

  # ---- HUD ----------------------------------------------------------------
  ui:
    Behaviours:
      canvas:
        Type: ui canvas
        Properties:
          MatchWidthOrHeight: 0.5
          ReferenceResolution: !vec { X: 1920, Y: 1080 }
    Children:
      hud:
        # There is no world-space text behaviour, so the grid is labelled row by row from a screen
        # overlay rather than with a caption under each prop.
        Behaviours:
          layout:
            Type: ui container
            Properties:
              Direction: vertical
              Spacing: 6
              Padding: 24
              ChildAlignment: upper-left
        Children:
          title:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.title
                  FontSize: 30
                  PreferredHeight: 40
          back row:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.row.back
                  FontSize: 24
                  PreferredHeight: 34
          front row:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.row.front
                  FontSize: 24
                  PreferredHeight: 34
          sampler row:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.row.sampler
                  FontSize: 24
                  PreferredHeight: 34
          quit hint:
            Behaviours:
              label:
                Type: text label
                Properties:
                  Text: !text hud.quit
                  FontSize: 20
                  PreferredHeight: 30

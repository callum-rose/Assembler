Game:
  Title: "Riftwell: Gesture Bastion"
  Description: |
    A single-screen arcade defence built to stress the TOUCH-GESTURE triggers and
    the TRIGGER-OUTPUT (!output) plumbing harder than any other descriptor. You
    guard the Riftwell - a wellspring of rift energy - from waves of husks that
    drift, weave and bulldoze toward it. Every verb is a pointer gesture, and
    every verb's payload is carried by trigger outputs.

    THE FIVE VERBS (mouse on desktop, finger on mobile - the pointer triggers
    read whichever device acted last):
      TAP        - fire a bolt from the well toward the tap point. The tap's
                   screen position rides the listener edge into the spawner's
                   velocity parameter (position -> screenToWorld -> Seek).
                   Taps are free - spam away.
      DRAG       - steer the deflector paddle; every drag frame's position
                   output re-targets the paddle's smooth-move spring. The
                   paddle keeps itself tangential to the well - on top it
                   faces up, on the right it faces right.
      FLING      - a fast drag-release is a swipe: it launches a surge wave
                   from the paddle. direction AND distance outputs set its
                   heading and its speed - flinging harder throws it faster.
      HOLD       - plant a mine at the press point. The mine arms on a fuse
                   (a deferred trigger); KEEP holding through the second
                   long-press threshold and the same fuse arms it HEAVY
                   instead (condition-gate pair picks the payload template).
      PINCH      - two fingers resize the orbiter ring (scale output) and spin
                   it (angle_delta output). Desktop parity: the scroll wheel
                   (a Controls value action) converges on the SAME variable.

    OUTPUT-DRIVEN COMBAT. Deflections read the collision's contact_point and
    other_velocity outputs (spark at the point, camera clang scaled by impact
    speed). The well's wounds scale with the intruder's impact velocity. A
    dying drifter splits into shards KICKED AWAY FROM ITS KILLER - the hit
    detector binds the projectile's other_position, and the death gate forwards
    it into the shard spawners' kick parameters. Score and integrity are
    watched by variable-changed triggers whose value/previous outputs drive the
    "+N" strike readout and a damage-scaled camera shake.

    WAVES ARE A RECORD TABLE (drifters / weavers / bulwarks / health / speed /
    bounty / gap per surge). Drifters split, weavers steer away from your
    bolts (perceive + steering), bulwarks shrug off taps and must be mined
    or surged. Kills feed a decaying combo that multiplies bounty.

    Desktop: mouse gestures + scroll ring + Esc quit. Mobile: identical, plus
    pinch. Survive every surge or watch the well collapse.

World:
  Dimensionality: 3
  BackgroundColor: "#05060f"

Physics:
  Gravity: !vec { X: 0, Y: 0, Z: 0 }

# One surge of the assault per record, listed in `surge table`.
Records:
  Wave:
    drifters: { Type: int,   Default: 0 }
    weavers:  { Type: int,   Default: 0 }
    bulwarks: { Type: int,   Default: 0 }
    health:   { Type: int,   Default: 3 }
    speed:    { Type: float, Default: 1.6 }
    bounty:   { Type: int,   Default: 5 }
    gap:      { Type: float, Default: 1.0 }

Constants:
  # --- Camera / screen->world mapping (the camera must NOT move or zoom:
  #     every gesture converts screen space to the z=0 plane through these) ---
  camera position: !vec { X: 0, Y: 0, Z: -14 }
  camera size: 5.0

  # --- Arena ---
  well position: !vec { X: 0, Y: 0, Z: 0 }
  spawn radius: 7.6
  paddle min: !vec { X: -8.2, Y: -4.4, Z: 0 }
  paddle max: !vec { X: 8.2, Y: 4.4, Z: 0 }

  # --- The campaign ---
  # Remember every drifter splits into two shards, so a wave's true head
  # count is roughly 3x its drifter entry - keep these numbers modest.
  surge table: !record [
    { Type: Wave, drifters: 3, weavers: 0, bulwarks: 0, health: 2, speed: 1.1, bounty: 5,  gap: 1.6 },
    { Type: Wave, drifters: 4, weavers: 1, bulwarks: 0, health: 3, speed: 1.2, bounty: 6,  gap: 1.5 },
    { Type: Wave, drifters: 5, weavers: 2, bulwarks: 1, health: 3, speed: 1.3, bounty: 7,  gap: 1.4 },
    { Type: Wave, drifters: 4, weavers: 3, bulwarks: 1, health: 4, speed: 1.5, bounty: 8,  gap: 1.3 },
    { Type: Wave, drifters: 6, weavers: 3, bulwarks: 2, health: 5, speed: 1.6, bounty: 9,  gap: 1.2 },
    { Type: Wave, drifters: 6, weavers: 4, bulwarks: 2, health: 6, speed: 1.8, bounty: 10, gap: 1.1 },
    { Type: Wave, drifters: 8, weavers: 5, bulwarks: 3, health: 8, speed: 2.0, bounty: 12, gap: 1.0 } ]
  max wave: 7

  # --- Economy ---
  start integrity: 25
  energy cap: 100
  start energy: 70
  energy regen: 4
  regen tick: 0.5
  energy per kill: 4
  surge cost: 20
  mine cost: 30
  combo window: 2.5

  # --- Bolt (tap) ---
  bolt speed: 14.0
  bolt damage: 2
  bolt life: 1.2

  # --- Surge wave (fling) ---
  surge base speed: 9.0
  surge damage: 3
  surge bulwark damage: 2
  surge knockback: 5.0
  surge life: 0.9

  # --- Mines (hold) ---
  mine fuse: 0.85
  mine life: 15.0
  blast damage: 4
  heavy blast damage: 9
  blast knockback: 6.5

  # --- Orbiter ring (pinch / scroll) ---
  ring min radius: 1.2
  ring max radius: 4.2
  ring base spin: 55.0
  ring twist factor: 1.6
  scroll step: 0.4
  orbiter damage: 2
  orbiter knockback: 4.0

  # --- Combat tuning ---
  impact damage factor: 0.6
  shard kick: 5.0
  weaver evade radius: 2.6

  # --- Palette ---
  well colour: !colour { R: 0.25, G: 0.9, B: 0.95, A: 1 }
  paddle colour: !colour { R: 0.55, G: 0.75, B: 1.0, A: 1 }
  bolt colour: !colour { R: 0.4, G: 0.95, B: 1.0, A: 1 }
  surge colour: !colour { R: 0.3, G: 0.95, B: 0.75, A: 1 }
  mine colour: !colour { R: 0.95, G: 0.7, B: 0.2, A: 1 }
  heavy mine colour: !colour { R: 0.95, G: 0.3, B: 0.2, A: 1 }
  orbiter colour: !colour { R: 0.7, G: 0.4, B: 0.95, A: 1 }
  drifter colour: !colour { R: 0.9, G: 0.3, B: 0.4, A: 1 }
  shard colour: !colour { R: 0.95, G: 0.5, B: 0.35, A: 1 }
  weaver colour: !colour { R: 0.95, G: 0.75, B: 0.25, A: 1 }
  bulwark colour: !colour { R: 0.55, G: 0.6, B: 0.7, A: 1 }
  spark colour: !colour { R: 1.0, G: 0.95, B: 0.8, A: 1 }
  health full colour: !colour { R: 0.25, G: 0.95, B: 0.4, A: 1 }
  health low colour: !colour { R: 1.0, G: 0.15, B: 0.1, A: 1 }

Variables:
  integrity: !var start integrity
  energy: !var start energy
  score: 0
  kills: 0
  combo: 0
  last kill time: -100.0
  last gain: 0

  # Surge-loop state (the director rolls wave 0 -> 1 on the first frame).
  wave: 0
  drifters to spawn: 0
  weavers to spawn: 0
  bulwarks to spawn: 0
  husks alive: 0
  spawn gap: 1.0

  # Verb state.
  paddle target: !vec { X: 0, Y: -3, Z: 0 }
  ring radius: 2.2
  ring angle: 0.0
  mine pending: false
  mine heavy: false
  mine pos: !vec { X: 0, Y: 0, Z: 0 }

Expressions:
  # Screen-space pointer -> world point on the z=0 plane for the FIXED
  # orthographic camera (the FlockingDemo mapping; self-contained, no Camera.main).
  screenToWorld:
    ArgumentTypes: [ vector, vector, float ]
    ArgumentNames: [ screen_pos, cam_pos, ortho ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Screen, UnityEngine.Vector3 ]
    Expression: |
      var w = UnityEngine.Screen.width * 1f;
      var h = UnityEngine.Screen.height * 1f;
      var aspect = w / h;
      var x = cam_pos.x + (screen_pos.x / w - 0.5f) * 2f * ortho * aspect;
      var y = cam_pos.y + (screen_pos.y / h - 0.5f) * 2f * ortho;
      return new Vector3(x, y, 0f);

  # Bolt launch velocity: from the well toward the (screen-space) tap point.
  shotVelocity:
    ArgumentTypes: [ vector, vector, float, vector, float ]
    ArgumentNames: [ target_screen, cam_pos, ortho, origin, speed ]
    ReturnType: vector
    Expression: "return Seek(origin, screenToWorld(target_screen, cam_pos, ortho), speed);"

  # Surge wave velocity: swipe direction scaled by how hard the fling was.
  shockVelocity:
    ArgumentTypes: [ vector, float, float ]
    ArgumentNames: [ dir, dist, base_speed ]
    ReturnType: vector
    Expression: "return ScaleVector(Normalize(dir), base_speed * Clamp(dist / 300f, 0.9f, 2.2f));"

  # Push a body directly away from a world point.
  knockAway:
    ArgumentTypes: [ vector, vector, float ]
    ArgumentNames: [ self, from, power ]
    ReturnType: vector
    Expression: "return ScaleVector(Normalize(SubtractVector(self, from)), power);"

  # Shard launch: away from the killer, with an angular scatter.
  shardKick:
    ArgumentTypes: [ vector, vector, float ]
    ArgumentNames: [ self, from, power ]
    ReturnType: vector
    Expression: "return Rotate2D(knockAway(self, from, power), RandomFloat(-40f, 40f));"

  # A point on the orbit ring: centre + a radius vector swung to angle+phase.
  orbitPos:
    ArgumentTypes: [ vector, float, float, float ]
    ArgumentNames: [ center, radius, angle, phase ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: "return IntegratePosition(center, Rotate2D(new Vector3(radius, 0f, 0f), angle + phase), 1f);"

  # Tangential paddle facing: the bar's long axis stays perpendicular to the
  # spoke from the well, so on top it faces up, on the right it faces right.
  # Heading2D is degrees CCW from +x; +90 maps "radially outward" onto the
  # bar's default horizontal pose (it starts at the bottom of the arena).
  paddleFacing:
    ArgumentTypes: [ vector, vector ]
    ArgumentNames: [ center, pos ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: "return new Vector3(0f, 0f, Heading2D(center, pos) + 90f);"

  ringClamp:
    ArgumentTypes: [ float, float, float ]
    ArgumentNames: [ r, lo, hi ]
    ReturnType: float
    Expression: "return Clamp(r, lo, hi);"

  # Integer add-with-ceiling for the energy pool.
  energyGain:
    ArgumentTypes: [ int, int, int ]
    ArgumentNames: [ energy, gain, cap ]
    ReturnType: int
    Expression: |
      var e = energy + gain;
      return e > cap ? cap : e;

  # Wound size from an intruder's impact velocity (always at least 1).
  impactDamage:
    ArgumentTypes: [ vector, float ]
    ArgumentNames: [ vel, k ]
    ReturnType: int
    Expression: "return (int)Max(1f, Ceil(Magnitude(vel) * k));"

  # Bounty through the combo multiplier: x1 at no combo, +25% per combo step.
  comboScore:
    ArgumentTypes: [ int, int, int ]
    ArgumentNames: [ score, bounty, combo ]
    ReturnType: int
    Expression: "return score + bounty * (4 + combo) / 4;"

  gainOf:
    ArgumentTypes: [ int, int ]
    ArgumentNames: [ value, previous ]
    ReturnType: int
    Expression: "return value - previous;"

  # Camera shake amplitude from how much integrity a hit removed.
  hurtShake:
    ArgumentTypes: [ int, int ]
    ArgumentNames: [ previous, value ]
    ReturnType: float
    Expression: "return Clamp((previous - value) * 0.3f, 0.2f, 2.5f);"

  # Camera clang amplitude from a deflected body's impact speed.
  impactShake:
    ArgumentTypes: [ vector ]
    ArgumentNames: [ vel ]
    ReturnType: float
    Expression: "return Clamp(Magnitude(vel) * 0.12f, 0.1f, 1.2f);"

  healthGlow:
    ArgumentTypes: [ int, int, colour, colour ]
    ArgumentNames: [ health, max_health, full, hurt ]
    ReturnType: colour
    Expression: "return LerpColor(hurt, full, max_health > 0 ? (float)health / (float)max_health : 0f);"

  # ---------- Surge-table lookups ----------
  waveInt:
    ArgumentTypes: [ record list, int, string ]
    ArgumentNames: [ table, wave, field ]
    ReturnType: int
    Expression: "return wave >= 1 && wave <= table.Count() ? GetInt(table[wave - 1], field) : 0;"

  waveFloat:
    ArgumentTypes: [ record list, int, string ]
    ArgumentNames: [ table, wave, field ]
    ReturnType: float
    Expression: "return wave >= 1 && wave <= table.Count() ? GetFloat(table[wave - 1], field) : 1f;"

  # ---------- Husk brains ----------
  seekWell:
    ArgumentTypes: [ vector, vector, float ]
    ArgumentNames: [ pos, target, speed ]
    ReturnType: vector
    Expression: "return Seek(pos, target, speed);"

  # Weavers duck sideways when a bolt closes in.
  evadeShots:
    ArgumentTypes: [ vector, vector, bool, float, float ]
    ArgumentNames: [ pos, threat, near, radius, max ]
    ReturnType: vector
    RegisterTypes: [ UnityEngine.Vector3 ]
    Expression: "return near && Distance(pos, threat) < radius ? Flee(pos, threat, max) : new Vector3(0f, 0f, 0f);"

  shardHealth:
    ArgumentTypes: [ int ]
    ArgumentNames: [ max_health ]
    ReturnType: int
    Expression: "return (max_health + 2) / 3;"

Controls:
  Actions:
    # Desktop stand-in for the pinch: scroll resizes the orbiter ring. The
    # pinch trigger and this action converge on the SAME `ring radius` variable.
    ring-adjust: { Type: value, ValueType: vector2 }
    quit: { Type: button, Phase: down }

  Bindings:
    desktop:
      ring-adjust: [ "<Mouse>/scroll" ]
      quit: [ "<Keyboard>/escape" ]
    mobile:
      ring-adjust: [ "<Gamepad>/rightStick" ]
      quit: [ "<Gamepad>/start" ]

Localisation:
  DefaultLocale: en
  Locales:
    en:
      hud.title: "RIFTWELL"
      hud.help1: "Tap: bolt   Drag: deflector   Fling it: surge wave"
      hud.help2: "Hold: plant mine (keep holding = heavy)"
      hud.help3: "Pinch / scroll: orbiter ring"
      hud.integrity: "Well integrity: {0}"
      hud.energy: "Energy: {0} / {1}"
      hud.wave: "Surge: {0} / {1}"
      hud.score: "Score: {0}"
      hud.combo: "Combo x{0}"
      hud.gain: "Last strike: +{0}"
      hud.final: "!!  FINAL SURGE  !!"
      btn.quit: "Collapse the Well"

Templates:
  # ---------------------------------------------------------------------------
  # DRIFTER - dumb mass. Re-aims at the well on a cadence, so paddle bounces
  # and knockbacks send it flying before it corrects course. On death it
  # splits into two shards kicked away from whatever killed it: every hit
  # detector binds the striker's other_position, and the death gate forwards
  # that context into the shard spawners' kick parameter.
  # ---------------------------------------------------------------------------
  drifter_template:
    Tags: [ enemy, drifter ]
    Variables:
      health: !parameter health
      max health: !parameter health
      base speed: !parameter speed
      bounty: !parameter bounty
      dead: false
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.62, Y: 0.62, Z: 0.62 }, Colour: !var drifter colour }
      glow:
        Type: light
        Properties:
          Type: point
          Colour: !expr
            Do: healthGlow
            With:
              health: !var health
              max_health: !var max health
              full: !var health full colour
              hurt: !var health low colour
          Intensity: 1.2
          Range: 2.0
      hull:
        Type: sphere collider
        Properties: { Radius: 0.32 }
      rb:
        Type: rigidbody
        Properties:
          UseGravity: false
          Mass: 1.0
          LinearDamping: 0.6
          FreezePosition: !vec { X: 0, Y: 0, Z: 1 }
          FreezeRotation: !vec { X: 1, Y: 1, Z: 1 }

      # Physics-friendly homing: periodically reset velocity toward the well,
      # so deflections are real but never permanent.
      steer clock:
        Type: interval trigger
        Properties: { Interval: 0.25, AutoStart: true }
        Listeners: [ aim at well ]
      aim at well:
        Type: set velocity
        Properties:
          Velocity: !expr
            Do: seekWell
            With:
              pos: !entity { Property: Position }
              target: !var well position
              speed: !var base speed

      # ---- Hit detectors: each binds the striker's position for the shards ----
      bolt hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ bolt ] }
        Listeners:
          - { BehaviourId: take bolt damage }
          - { BehaviourId: death check, Outputs: { other_position: killer_pos } }
      take bolt damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With: { health: !var health, damage: !var bolt damage }

      surge hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ wavefront ] }
        Listeners:
          - { BehaviourId: take surge damage }
          - { BehaviourId: surge shove, Outputs: { other_position: shover_pos } }
          - { BehaviourId: death check, Outputs: { other_position: killer_pos } }
      take surge damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With: { health: !var health, damage: !var surge damage }
      surge shove:
        Type: add impulse
        Properties:
          Impulse: !expr
            Do: knockAway
            With:
              self: !entity { Property: Position }
              from: !output shover_pos
              power: !var surge knockback

      blast hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ blast ] }
        Listeners:
          - { BehaviourId: take blast damage }
          - { BehaviourId: blast shove, Outputs: { other_position: shover_pos } }
          - { BehaviourId: death check, Outputs: { other_position: killer_pos } }
      take blast damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With: { health: !var health, damage: !var blast damage }
      blast shove:
        Type: add impulse
        Properties:
          Impulse: !expr
            Do: knockAway
            With:
              self: !entity { Property: Position }
              from: !output shover_pos
              power: !var blast knockback

      heavy hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ heavyblast ] }
        Listeners:
          - { BehaviourId: take heavy damage }
          - { BehaviourId: blast shove, Outputs: { other_position: shover_pos } }
          - { BehaviourId: death check, Outputs: { other_position: killer_pos } }
      take heavy damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With: { health: !var health, damage: !var heavy blast damage }

      orbiter hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ orbiter ] }
        Listeners:
          - { BehaviourId: take orbiter damage }
          - { BehaviourId: orbiter shove, Outputs: { other_position: shover_pos } }
          - { BehaviourId: death check, Outputs: { other_position: killer_pos } }
      take orbiter damage:
        Type: int variable setter
        Properties:
          VariableId: !var health
          Value: !expr
            Do: 'health - damage'
            ArgumentTypes: [ int, int ]
            With: { health: !var health, damage: !var orbiter damage }
      orbiter shove:
        Type: add impulse
        Properties:
          Impulse: !expr
            Do: knockAway
            With:
              self: !entity { Property: Position }
              from: !output shover_pos
              power: !var orbiter knockback

      # ---- Death path 1: destroyed. The killer_pos output bound on the hit
      #      edge crosses this gate into the shard kick expressions. ----
      death check:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: 'health <= 0 && !dead'
            ArgumentTypes: [ int, bool ]
            With: { health: !var health, dead: !var dead }
        Listeners:
          - { BehaviourId: pay score }
          - { BehaviourId: tally kill }
          - { BehaviourId: refund energy }
          - { BehaviourId: mark dead }
          - { BehaviourId: raise alive for shards }
          - { BehaviourId: split a }
          - { BehaviourId: split b }
          - { BehaviourId: drop alive }
          - { BehaviourId: vanish }
      pay score:
        Type: int variable setter
        Properties:
          VariableId: !var score
          Value: !expr
            Do: comboScore
            With: { score: !var score, bounty: !var bounty, combo: !var combo }
      tally kill:
        Type: int variable setter
        Properties:
          VariableId: !var kills
          Value: !expr
            Do: 'kills + 1'
            With: { kills: !var kills }
      refund energy:
        Type: int variable setter
        Properties:
          VariableId: !var energy
          Value: !expr
            Do: energyGain
            With: { energy: !var energy, gain: !var energy per kill, cap: !var energy cap }
      raise alive for shards:
        Type: int variable setter
        Properties:
          VariableId: !var husks alive
          Value: !expr
            Do: 'alive + 2'
            With: { alive: !var husks alive }
      split a:
        Type: spawner
        Properties:
          TemplateId: shard_template
          Position: !entity { Property: Position }
          Parameters:
            health: !expr { Do: shardHealth, With: { max_health: !var max health } }
            speed: !expr
              Do: 'speed * 1.4f'
              ArgumentTypes: [ float ]
              ReturnType: float
              With: { speed: !var base speed }
            bounty: !expr
              Do: 'bounty / 2'
              ArgumentTypes: [ int ]
              ReturnType: int
              With: { bounty: !var bounty }
            kick: !expr
              Do: shardKick
              With:
                self: !entity { Property: Position }
                from: !output killer_pos
                power: !var shard kick
      split b:
        Type: spawner
        Properties:
          TemplateId: shard_template
          Position: !entity { Property: Position }
          Parameters:
            health: !expr { Do: shardHealth, With: { max_health: !var max health } }
            speed: !expr
              Do: 'speed * 1.4f'
              ArgumentTypes: [ float ]
              ReturnType: float
              With: { speed: !var base speed }
            bounty: !expr
              Do: 'bounty / 2'
              ArgumentTypes: [ int ]
              ReturnType: int
              With: { bounty: !var bounty }
            kick: !expr
              Do: shardKick
              With:
                self: !entity { Property: Position }
                from: !output killer_pos
                power: !var shard kick

      # ---- Death path 2: reached the well (physics collision, not trigger) ----
      breach:
        Type: collision enter trigger
        Properties: { TagsToDetect: [ well ] }
        Listeners: [ breach check ]
      breach check:
        Type: condition gate
        Properties:
          Condition: !expr
            Do: '!dead'
            ArgumentTypes: [ bool ]
            With: { dead: !var dead }
        Listeners: [ mark dead, drop alive, vanish ]

      # ---- Shared death plumbing ----
      mark dead:
        Type: bool variable setter
        Properties: { VariableId: !var dead, Value: true }
      drop alive:
        Type: int variable setter
        Properties:
          VariableId: !var husks alive
          Value: !expr
            Do: 'alive - 1'
            With: { alive: !var husks alive }
      vanish:
        Type: destroy

  # ---------------------------------------------------------------------------
  # SHARD - a drifter fragment. Spawned mid-death with a kick velocity that
  # was computed FROM THE KILLING BLOW'S other_position output; it re-aims at
  # the well after the kick decays. Does not split again.
  # ---------------------------------------------------------------------------
  shard_template:
    Tags: [ enemy, shard ]
    Variables:
      health: !parameter health
      max health: !parameter health
      base speed: !parameter speed
      bounty: !parameter bounty
      dead: false
    Behaviours:
      body:
        Type: primitive
        Properties: { Shape: sphere, Size: !vec { X: 0.34, Y: 0.34, Z: 0.34 }, Colour: !var shard colour }
      hull:
        Type: sphere collider
        Properties: { Radius: 0.18 }
      rb:
        Type: rigidbody
        Properties:
          UseGravity: false
          Mass: 0.5
          LinearDamping: 0.5
          FreezePosition: !vec { X: 0, Y: 0, Z: 1 }
          FreezeRotation: !vec { X: 1, Y: 1, Z: 1 }
      launch:
        Type: on start trigger
        Listeners: [ take kick ]
      take kick:
        Type: set velocity
        Properties: { Velocity: !parameter kick }
      steer clock:
        Type: interval trigger
        Properties: { Interval: 0.7, AutoStart: true }
        Listeners: [ aim at well ]
      aim at well:
        Type: set velocity
        Properties:
          Velocity: !expr
            Do: seekWell
            With:
              pos: !entity { Property: Position }
              target: !var well position
              speed: !var base speed

      bolt hit:
        Type: trigger enter trigger
        Properties: { TagsToDetect: [ bolt ] }
        Listeners:
          - { BehaviourId: take bolt damage }
